stays:
  - city: "Osaka"
    area: "Shinsaibashi / Hommachi"
    type: "Hostel private room"
    nights: "4 nights (book as 3 + 1, minus Koyasan night)"
    dates: "Oct 11, 12, 13, 15"
    cost_per_night: "₹4,500"
    total: "₹18,000"
    status: "book"
    image: "https://images.unsplash.com/photo-1553621042-f6e147245754?w=600&h=400&fit=crop&q=80"
    notes: "Pick: &And Hostel Shinsaibashi East (andhostel.jp) or Imano Osaka Shinsaibashi (hostelworld). Central on the Midosuji line. Book Oct 11–13 + a separate Oct 15 night; do Koyasan with an overnight bag and let the hostel store your big bag."

  - city: "Koyasan"
    area: "Temple (Mount Koya)"
    type: "Shukubo (temple stay)"
    nights: "1 night (Oct 14)"
    dates: "Oct 14"
    cost_per_night: "₹10,000"
    total: "₹10,000"
    status: "book"
    image: "https://images.unsplash.com/photo-1580537659466-0a9bfa916a54?w=600&h=400&fit=crop&q=80"
    notes: "Includes shojin ryori dinner + breakfast + 6am prayer. Book at koyasan-shukubo.net. Eko-in (Goma fire ritual), Shojoshin-in (cheapest, by Okunoin), or Fukuchi-in (onsen). Book early — October sells out, and solo occupancy carries a surcharge."

  - city: "Kyoto"
    area: "Sanjo / Karasuma (central)"
    type: "Hostel private room"
    nights: "4 nights (Oct 16–19)"
    dates: "Oct 16, 17, 18, 19"
    cost_per_night: "₹4,500"
    total: "₹18,000"
    status: "book"
    image: "https://images.unsplash.com/photo-1758470476240-dcbd04d3f799?w=600&h=400&fit=crop&q=80"
    notes: "Pick: Piece Hostel Sanjo (central all-rounder) or Piece Hostel Kyoto (by the station for the Hiroshima shinkansen). Gojo Guesthouse is the cheapest/quietest; Len Kawaramachi the most atmospheric."

  - city: "Miyajima"
    area: "Itsukushima Island"
    type: "Guesthouse / ryokan"
    nights: "1 night (Oct 20)"
    dates: "Oct 20"
    cost_per_night: "₹6,000"
    total: "₹6,000"
    status: "book"
    image: "https://images.unsplash.com/photo-1768946579156-e29e7397b0bc?w=600&h=400&fit=crop&q=80"
    notes: "Stay ON the island for the dawn torii. Budget: Miyajima Guest House Mikuniya. Splurge: Sakuraya (affordable ryokan) or Kikunoya (onsen + kaiseki). Tiny inventory + October foliage — book early. NOT 'Backpackers Miyajima' (that's on the mainland)."

  - city: "Tokyo"
    area: "Asakusa / Kuramae or Shinjuku"
    type: "Hostel private room"
    nights: "2 nights (Oct 21–22)"
    dates: "Oct 21, 22"
    cost_per_night: "₹5,000"
    total: "₹10,000"
    status: "book"
    image: "https://images.unsplash.com/photo-1764418658791-771bb04efdcd?w=600&h=400&fit=crop&q=80"
    notes: "Pick: Nui. Hostel & Bar (Kuramae) or K's House Tokyo Oasis (Asakusa) for old Tokyo; UNPLAN Shinjuku if you want to anchor the Shinkai anime route. All within ~30 min of Shibuya."

  - city: "Narita"
    area: "Inside Terminal 2"
    type: "Capsule hotel"
    nights: "1 night (Oct 23)"
    dates: "Oct 23"
    cost_per_night: "₹3,500"
    total: "₹3,500"
    status: "book"
    image: "https://images.unsplash.com/photo-1556388158-158ea5ccacbd?w=600&h=400&fit=crop&q=80"
    notes: "9h nine hours Narita — inside Terminal 2, walk to check-in in 5 min. Essential for the 05:45 flight (be at check-in ~03:45, before trains run). Hotel shuttles don't run early enough. Book early (ninehours.co.jp)."
