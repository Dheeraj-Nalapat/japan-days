              full_desc: "Tokyo's oldest and most visited Buddhist temple, founded in 628 AD. The massive Kaminarimon gate leads to Nakamise-dori — a 250m shopping street."
              hours: "Temple grounds: 24/7. Main hall: 06:00–17:00"
              time_needed: "1.5–2 hours"
              station: "Asakusa Station (浅草駅) — 1 min walk"
              maps_query: "Senso-ji+Temple+Asakusa+Tokyo"
              tips: "Arrive before 7am for the misty, tourist-free experience. Try freshly made ningyo-yaki and thunder crackers."
          - tag: "quiet"
            tag_text: "Very Quiet"
            name: "Yanaka Ginza"
            desc: "Tokyo's most nostalgic old shopping street. Tofu shops, sembei crackers, cats on rooftops. Almost no tourists. 🐱"
            image: "https://images.unsplash.com/photo-1565707990801-71e6d5f10ac6?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A lovingly preserved old-school Tokyo shopping street that survived war and modernisation. Small family-run shops, cats as unofficial mascots."
              hours: "Most shops 10:00–18:00"
              time_needed: "1.5–2 hours"
              station: "Nippori Station (日暮里駅) — 5 min walk downhill"
              maps_query: "Yanaka+Ginza+Tokyo"
              tips: "Enter from Nippori side for the famous 'Yuyake Dandan' sunset stairs. Try the ¥70 menchi-katsu at the top."
          - tag: "main"
            tag_text: "Afternoon"
            name: "Shibuya"
            desc: "Scramble Crossing + Shibuya Sky observation deck at sunset (¥2,000). World's busiest pedestrian crossing. 🌆"
            image: "https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "The world's busiest pedestrian crossing — up to 3,000 people cross simultaneously. Shibuya Sky offers a rooftop observation deck at 229m."
              hours: "Shibuya Sky: 09:00–22:45 (last entry 21:20)"
              time_needed: "2–3 hours"
              station: "Shibuya Station (渋谷駅)"
              maps_query: "Shibuya+Scramble+Crossing+Tokyo"
              tips: "Book Shibuya Sky online in advance — sunset slots sell out. Nonbei Yokocho nearby has tiny atmospheric bars."
          - tag: "quiet"
            tag_text: "Evening"
            name: "Koenji"
            desc: "Tokyo's indie/bohemian district. Antique shops, vinyl record stores, great izakayas, zero tourist vibe. 🎸"
            image: "https://images.unsplash.com/photo-1565707990801-71e6d5f10ac6?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A bohemian neighbourhood known for second-hand clothing, vinyl records, independent music venues, and friendly izakayas."
              hours: "Shops 12:00–20:00, bars 17:00–late"
              time_needed: "2–3 hours (evening)"
              station: "Koenji Station (高円寺駅) — JR Chuo Line"
              maps_query: "Koenji+Tokyo"
              tips: "Start at the south exit, wander the covered arcade. The record shops on Look Street are excellent. Don't miss the tiny standing bars (tachinomi)."

      - num: "DAY 13"
        date: "Oct 23"
        title: "Modern Tokyo + Last Shopping"
        places:
          - tag: "food"
            tag_text: "Breakfast"
            name: "Tsukiji Outer Market"
            desc: "sushi breakfast at 7am 🍣. The outer market remains vibrant and authentic."
            image: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "The outer market surrounding the former Tsukiji fish market — hundreds of small shops serve the freshest sushi, tamago, and seafood."
              hours: "05:00–14:00 (best before 10am)"
              time_needed: "1–1.5 hours"
              station: "Tsukiji Station (築地駅) — 1 min walk"
              maps_query: "Tsukiji+Outer+Market+Tokyo"
              tips: "Go before 8am for best selection. Try smaller shops like Tsukiji Sushi-Sei for equal quality with no wait. Budget ¥2,000–4,000."
          - tag: "quiet"
            tag_text: "Hidden"
            name: "Hamarikyu Gardens"
            desc: "300-year-old shogunate garden surrounded by skyscrapers. Surreal, peaceful contrast. ¥300 🏯"
            image: "https://images.unsplash.com/photo-1490806843957-31f4c9a91c65?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A 250,000 sqm Edo-period garden — originally a duck hunting ground for the Tokugawa shoguns. The tea house on the island serves matcha surrounded by skyscrapers."
              hours: "09:00–17:00 (last entry 16:30)"
              time_needed: "1–1.5 hours"
              station: "Shiodome Station (汐留駅) — 5 min walk"
              maps_query: "Hamarikyu+Gardens+Tokyo"
              tips: "The matcha tea on the island (¥510) is one of Tokyo's best value experiences. You can take a water bus to Asakusa from here (¥860, 35 min)."
          - tag: "main"
            tag_text: "Afternoon"
            name: "Shimokitazawa"
            desc: "Tokyo's indie music and vintage fashion neighbourhood. No chain stores, no tourists, great record shops and pour-over coffee. 🎶"
            image: "https://images.unsplash.com/photo-1764418658791-771bb04efdcd?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Tokyo's most beloved indie neighbourhood — vintage clothing, vinyl records, independent coffee, small theatres, and live music. Zero chain stores."
              hours: "Shops 12:00–20:00. Bars: 18:00–late"
              time_needed: "2–3 hours"
              station: "Shimokitazawa Station (下北沢駅) — Keio Inokashira from Shibuya (3 min)"
              maps_query: "Shimokitazawa+Tokyo"
              tips: "Best vintage shops on the south side. Bear Pond Espresso is legendary. Bonus Track complex has great coffee."

