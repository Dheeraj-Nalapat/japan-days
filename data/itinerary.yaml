cities:
  - name: "Osaka"
    jp: "大阪"
    flag: "🏯"
    dates: "Oct 11 – 12"
    nights: "2 nights"
    image: "https://images.unsplash.com/photo-1759746334715-fae30ec56600?w=1200&h=600&fit=crop&q=80"
    days:
      - num: "DAY 1"
        date: "Oct 11"
        title: "Arrival — Arrive KIX 18:25 local"
        places:
          - tag: "main"
            tag_text: "Transit"
            name: "Haruka Express"
            desc: "KIX to Namba/Tennoji (~75 min, ¥1,880). Check in to hostel in Namba or Shinsaibashi area."
            extended:
              full_desc: "The Haruka Express is a direct airport limited express connecting Kansai International Airport (KIX) to Tennoji and Namba stations. It's the fastest and most comfortable option for reaching central Osaka. Reserved seating available — book an ICOCA & Haruka combo ticket online in advance for a discount."
              hours: "Runs every 30 min, 06:30–22:16"
              time_needed: "75 minutes"
              station: "Kansai Airport Station (関西空港駅)"
              maps_query: "Kansai+Airport+Station+Osaka"
              tips: "Pre-book the ICOCA & Haruka discount ticket on the JR West website. The ICOCA card is rechargeable and works on all trains, buses, and convenience stores across Japan."
          - tag: "main"
            tag_text: "Evening"
            name: "Dotonbori"
            desc: "iconic neon canal. Try Takoyaki at Kukuru 🐙"
            extended:
              full_desc: "Osaka's most iconic entertainment district — a sensory overload of giant neon signs, mechanical crabs, and the famous Glico Running Man. The canal reflects all the lights at night, creating a mesmerising atmosphere. Street food stalls line both sides of the river."
              hours: "24/7 (most shops 11:00–23:00)"
              time_needed: "1.5–2 hours"
              station: "Namba Station (難波駅) — 5 min walk"
              maps_query: "Dotonbori+Osaka"
              tips: "Go after 8pm for the full neon effect. Takoyaki at Kukuru is reliable, but Wanaka is the local favourite. The area around Hozenji Yokocho (just south) is far quieter if you need a break."
          - tag: "quiet"
            tag_text: "Hidden"
            name: "Hozenji Yokocho"
            desc: "a lantern-lit mossy alley beside a tiny moss-draped temple. Far quieter than the Dotonbori chaos just 50m away."
            extended:
              full_desc: "A narrow, stone-paved alley lined with traditional lanterns and small restaurants, centered around Hozenji Temple — famous for its moss-covered Fudo Myo-o statue. Visitors splash water on the statue for good luck, and the resulting thick moss growth is considered sacred. Just 50 metres from the chaos of Dotonbori, yet feels like a completely different century."
              hours: "24/7 (restaurants typically 17:00–23:00)"
              time_needed: "20–30 minutes"
              station: "Namba Station (難波駅) — 3 min walk"
              maps_query: "Hozenji+Yokocho+Osaka"
              tips: "Visit after dark for the lantern-lit atmosphere. The tiny bar Hozenji-san at the entrance serves excellent sake. Perfect for a quiet nightcap after the Dotonbori madness."

      - num: "DAY 2"
        date: "Oct 12"
        title: "Quiet Osaka"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Osaka Castle"
            desc: "(¥600) — arrive before 9am, walk the Nishinomaru Garden for autumn foliage 🍁"
            extended:
              full_desc: "One of Japan's most famous landmarks, originally built in 1583 by Toyotomi Hideyoshi. The current reconstruction houses a museum with panoramic views from the 8th floor observation deck. The surrounding Nishinomaru Garden is the real highlight in October — 300 cherry trees turn golden, and the moat reflects the castle perfectly."
              hours: "09:00–17:00 (last entry 16:30)"
              time_needed: "1.5–2 hours"
              station: "Osakajokoen Station (大阪城公園駅) — 15 min walk"
              maps_query: "Osaka+Castle"
              tips: "Arrive at 9am opening to beat tour groups. The Nishinomaru Garden (¥200 extra) is worth it for the castle + foliage photo spot. Skip the castle interior if short on time — the park grounds are the main attraction in autumn."
          - tag: "quiet"
            tag_text: "Hidden"
            name: "Nakazaki-cho"
            desc: "Osaka's most bohemian neighbourhood. Vintage coffee shops, old wooden townhouses, almost zero tourists. Perfect afternoon wander."
            extended:
              full_desc: "A retro neighbourhood of pre-war wooden machiya townhouses converted into indie coffee shops, vintage clothing stores, art galleries, and tiny bars. It's Osaka's answer to Shimokitazawa — deeply local, almost entirely undiscovered by foreign tourists. The streets are narrow and feel like a time warp compared to the surrounding modern city."
              hours: "Most shops 11:00–19:00 (cafes from 08:00)"
              time_needed: "1.5–2 hours"
              station: "Nakazakicho Station (中崎町駅) — direct exit"
              maps_query: "Nakazakicho+Osaka"
              tips: "Start at Salon de AManTo for excellent pour-over coffee in a 100-year-old house. Wander without a map — the charm is in getting lost. Good vintage vinyl shops for record hunters."
          - tag: "food"
            tag_text: "Food"
            name: "Kuromon Ichiba Market"
            desc: "lunch with fresh sashimi and grilled scallops straight from the stalls"
            extended:
              full_desc: "Known as 'Osaka's Kitchen' for over 190 years, this 600-metre covered market has around 170 shops selling the freshest seafood, produce, and street food in the city. Many stalls let you eat on the spot — grilled scallops, sea urchin, and thick cuts of tuna sashimi are the highlights."
              hours: "09:00–18:00 (some stalls close earlier)"
              time_needed: "1–1.5 hours"
              station: "Nippombashi Station (日本橋駅) — 3 min walk"
              maps_query: "Kuromon+Ichiba+Market+Osaka"
              tips: "Go before 11am to avoid crowds. Budget ¥2,000–3,000 for a full seafood lunch across multiple stalls. The tuna sashimi at Maguro-ya Kurogin is legendary. Some stalls accept card, but bring cash to be safe."
          - tag: "main"
            tag_text: "Evening"
            name: "Shinsekai"
            desc: "retro 1950s district. Kushikatsu at Daruma. 🍢"
            extended:
              full_desc: "A retro entertainment district built around Tsutenkaku Tower, designed in the early 1900s to blend Paris and New York aesthetics. Today it's a gloriously kitschy, neon-lit maze of kushikatsu (deep-fried skewer) restaurants, old-school gaming arcades, and public baths. The atmosphere is pure old-school Osaka — loud, colourful, and unpretentious."
              hours: "Most shops 11:00–22:00"
              time_needed: "1.5–2 hours"
              station: "Dobutsuen-mae Station (動物園前駅) — 3 min walk"
              maps_query: "Shinsekai+Osaka"
              tips: "The golden rule of kushikatsu: never double-dip in the communal sauce. Daruma is the most famous chain, but Yaekatsu is the local pick. Climb Tsutenkaku Tower (¥900) at sunset for retro views."

  - name: "Kyoto"
    jp: "京都"
    flag: "⛩️"
    dates: "Oct 12 – 15"
    nights: "3 nights"
    image: "https://images.unsplash.com/photo-1758470476240-dcbd04d3f799?w=1200&h=600&fit=crop&q=80"
    days:
      - num: "DAY 3"
        date: "Oct 12"
        title: "Arrive Kyoto — Fushimi & Gion"
        places:
          - tag: "main"
            tag_text: "Afternoon"
            name: "Fushimi Inari Taisha"
            desc: "hike past the main torii gates to Yotsutsuji intersection halfway up. Go after 4pm when day-trippers leave — the upper mountain trails become blissfully silent. Free, 24/7."
            extended:
              full_desc: "Kyoto's most iconic shrine — thousands of vermillion torii gates snake up the forested slopes of Mount Inari. Most tourists stop at the first viewpoint, but continuing to the summit (233m) reveals increasingly atmospheric trails through ancient cedar forest. The shrine is dedicated to Inari, the god of rice and prosperity. Fox statues guard every turn."
              hours: "24/7, free admission"
              time_needed: "2–3 hours (full summit hike)"
              station: "Inari Station (稲荷駅) — JR Nara Line, direct exit to shrine"
              maps_query: "Fushimi+Inari+Taisha+Kyoto"
              tips: "Go after 4pm or before 7am to avoid crowds. The upper trails beyond Yotsutsuji intersection are nearly empty even at peak times. Bring water — no vending machines past the halfway point. The summit loop takes about 2 hours from the base."
          - tag: "quiet"
            tag_text: "Hidden"
            name: "Shinbashi-dori"
            desc: "in Gion — narrow stone-paved canal lane at dusk, lit by paper lanterns. Less photographed than Hanamikoji but more atmospheric. 🏮"
            extended:
              full_desc: "A narrow stone-paved lane running alongside the Shirakawa canal in the Gion district. Traditional wooden machiya townhouses with bamboo screens line both sides, and in the evening, warm paper lanterns cast golden light over the willow trees and water. It's the quintessential Kyoto scene — more intimate and less crowded than the famous Hanamikoji-dori."
              hours: "24/7 (best at dusk, 17:00–19:00)"
              time_needed: "30–45 minutes"
              station: "Gion-Shijo Station (祇園四条駅) — 5 min walk"
              maps_query: "Shinbashi-dori+Gion+Kyoto"
              tips: "Visit at dusk when the lanterns are lit and the light is golden. Walk slowly — you may spot a geiko (Kyoto's term for geisha) heading to an evening engagement. Photography is respectful here, but never follow or block geiko."

      - num: "DAY 4"
        date: "Oct 13"
        title: "Kurama & Kibune — Secret Mountain Villages"
        places:
          - tag: "quiet"
            tag_text: "Very Quiet"
            name: "Kurama → Kibune trail"
            desc: "Eizan Railway to Kurama (40 min). Hike through ancient cedar forest past Kurama-dera Temple, then descend into Kibune village. Almost no foreign tourists. Lunch at riverside kawadoko terrace restaurant above the stream. 🌲"
            extended:
              full_desc: "A stunning mountain trail connecting two ancient villages north of Kyoto. Start at Kurama village, visit Kurama-dera Temple (founded 770 AD), then hike through towering cedar forest over the mountain pass and descend into the enchanting Kibune village. In summer and autumn, Kibune's restaurants build wooden platforms (kawadoko) directly over the rushing stream — you eat traditional cuisine literally suspended above the water."
              hours: "Trail: dawn to dusk. Eizan Railway: 05:45–23:30"
              time_needed: "4–5 hours (including lunch)"
              station: "Kurama Station (鞍馬駅) — Eizan Railway from Demachiyanagi"
              maps_query: "Kurama+to+Kibune+trail+Kyoto"
              tips: "Start from Kurama side (uphill is easier this direction). Wear proper shoes — trail is rocky. The onsen (hot spring) in Kurama is excellent if you hike back. Book kawadoko lunch in advance at Hirobun or Kifune Kyubei."
              activity:
                booking: "Kawadoko restaurant — book 2–3 days ahead via phone or Tabelog"
                cost: "¥3,000–5,000 per person (kawadoko lunch set)"
                duration: "4–5 hours total"
                what_to_bring: "Hiking shoes, water, rain jacket, towel (for onsen)"
          - tag: "food"
            tag_text: "Evening"
            name: "Pontocho Alley"
            desc: "Kyoto's narrow riverside dining street. Kaiseki or yakitori dinner. 🍶"
            extended:
              full_desc: "One of Kyoto's most atmospheric dining streets — a single narrow lane running alongside the Kamo River, lined with traditional restaurants and izakayas. In warm months, many restaurants extend wooden terraces (yuka) over the river. The prices range from affordable yakitori joints to high-end kaiseki establishments."
              hours: "Most restaurants 17:00–23:00"
              time_needed: "1.5–2 hours"
              station: "Sanjo Station (三条駅) — 5 min walk"
              maps_query: "Pontocho+Alley+Kyoto"
              tips: "Walk the full alley first to see all options before choosing. River-facing seats (yuka) have a surcharge. For budget-friendly kaiseki, try a lunch set instead of dinner. Reservations recommended for popular spots."

      - num: "DAY 5"
        date: "Oct 14"
        title: "Arashiyama + Classic Temples"
        places:
          - tag: "main"
            tag_text: "Early AM"
            name: "Arashiyama Bamboo Grove"
            desc: "🎋 — arrive before 7:30am for silence, mist, and the ethereal early light. Completely different from the crowd-filled daytime."
            extended:
              full_desc: "A towering grove of moso bamboo that creates an otherworldly green tunnel. The stalks sway and creak in the wind, creating a natural soundscape. The path stretches about 500m from Tenryu-ji's north gate toward Okochi Sanso villa. Early morning transforms it from a crowded tourist spot into a genuinely magical experience."
              hours: "24/7, free admission"
              time_needed: "30–45 minutes"
              station: "Saga-Arashiyama Station (嵯峨嵐山駅) — 10 min walk"
              maps_query: "Arashiyama+Bamboo+Grove+Kyoto"
              tips: "Arrive before 7:30am — by 9am it's already crowded. Enter from the north (Okochi Sanso) side to walk against the tour group flow. The best light filters through around 7–8am. Pair with Jojakko-ji Temple next door."
          - tag: "quiet"
            tag_text: "Hidden"
            name: "Jojakko-ji Temple"
            desc: "a 5-minute walk from the bamboo grove that almost nobody visits. Moss-covered stone steps winding through maple trees. More atmospheric than Kinkaku-ji with a fraction of the visitors. 🍂"
            extended:
              full_desc: "A small Nichiren Buddhist temple hidden on a hillside in Arashiyama, just a 5-minute walk from the famous bamboo grove. Moss-covered stone steps wind up through ancient maple trees to a multi-story pagoda with sweeping views. In October, the maples turn fiery red and orange, creating one of Kyoto's most beautiful — and least visited — autumn colour scenes."
              hours: "09:00–17:00"
              time_needed: "45 minutes–1 hour"
              station: "Saga-Arashiyama Station (嵯峨嵐山駅) — 20 min walk"
              maps_query: "Jojakko-ji+Temple+Kyoto"
              tips: "Visit right at 9am opening after the bamboo grove. The upper terrace has the best views. In late October/early November, the moss + red maple combination is extraordinary. ¥500 admission."
          - tag: "main"
            tag_text: "Afternoon"
            name: "Kinkaku-ji"
            desc: "Golden Pavilion (¥500) + Ryoan-ji rock garden"
            extended:
              full_desc: "The legendary Golden Pavilion — a three-story Zen temple covered in gold leaf, reflected perfectly in its surrounding mirror pond. Originally built in 1397 as a retirement villa for Shogun Ashikaga Yoshimitsu. Nearby Ryoan-ji features Japan's most famous rock garden — 15 stones arranged in raked white gravel, designed so you can never see all 15 from any single angle."
              hours: "09:00–17:00"
              time_needed: "1.5 hours (both temples)"
              station: "Bus 205 from Kyoto Station to Kinkaku-ji-michi stop"
              maps_query: "Kinkaku-ji+Kyoto"
              tips: "Arrive at opening. The reflection photo works best on windless mornings. Ryoan-ji (¥500) is a 15-minute walk — do both together. The moss garden behind Kinkaku-ji is often overlooked but stunning."

      - num: "DAY 6"
        date: "Oct 15"
        title: "Eastern Kyoto + Nara Day Trip"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Kiyomizu-dera"
            desc: "(¥400) + walk Ninenzaka & Sannenzaka stone lanes"
            extended:
              full_desc: "A UNESCO World Heritage temple perched on a hillside with a massive wooden stage that juts out over the valley below. The current structure was built in 1633 without using a single nail. The surrounding hillside streets — Ninenzaka and Sannenzaka — are beautifully preserved Edo-period stone lanes lined with traditional shops, tea houses, and pottery stores."
              hours: "06:00–18:00 (seasonal night illuminations in autumn)"
              time_needed: "2–2.5 hours (including Ninenzaka walk)"
              station: "Kiyomizu-Gojo Station (清水五条駅) — 20 min uphill walk"
              maps_query: "Kiyomizu-dera+Kyoto"
              tips: "Open from 6am — arrive early to beat the crowds. Walk downhill through Ninenzaka and Sannenzaka after the temple. Check if autumn night illuminations (ライトアップ) are running — they're magical. Wear comfortable shoes for the steep approach."
          - tag: "main"
            tag_text: "Midday"
            name: "Nara"
            desc: "Train to Nara (45 min). Deer park 🦌, Todai-ji giant Buddha (¥600), Kasuga Taisha shrine"
            extended:
              full_desc: "Japan's first permanent capital (710–784 AD), now a peaceful city where over 1,200 wild deer roam freely through the parks and temple grounds. Todai-ji houses a 15-metre bronze Buddha in the world's largest wooden building. Kasuga Taisha shrine is famous for its thousands of stone and bronze lanterns — especially atmospheric at dusk."
              hours: "Todai-ji: 07:30–17:30. Kasuga Taisha: 06:30–17:30"
              time_needed: "3–4 hours"
              station: "Nara Station (奈良駅) — JR or Kintetsu, 10 min walk to park"
              maps_query: "Nara+Park+Deer+Japan"
              tips: "Buy deer crackers (¥200) from official vendors only. Bow to the deer — they'll bow back. The walk from Todai-ji to Kasuga Taisha through the forest is beautiful. Don't carry food in open bags — deer will investigate."
          - tag: "quiet"
            tag_text: "Hidden"
            name: "Isuien Garden"
            desc: "a hidden two-section strolling garden in Nara that most visitors skip. Uses \"borrowed scenery\" to frame Todai-ji's roof perfectly from within. ¥1,200. 🌿"
            extended:
              full_desc: "An exquisite two-part strolling garden from the Meiji era, using the 'shakkei' (borrowed scenery) technique to frame Todai-ji's massive roof and the surrounding hills as part of its composition. The front garden features a pond with stepping stones, while the rear garden is more expansive with a waterfall and tea house. Most Nara visitors walk right past it, making it one of the most peaceful spots in the city."
              hours: "09:30–16:30 (closed Tuesdays)"
              time_needed: "45 minutes–1 hour"
              station: "Nara Station — 15 min walk (between Todai-ji and town)"
              maps_query: "Isuien+Garden+Nara"
              tips: "The tea house serves matcha with a view of Todai-ji's roof — one of the best tea experiences in the region (¥500 extra). The rear garden has the best borrowed scenery composition. Closed Tuesdays."

  - name: "Hiroshima"
    jp: "広島"
    flag: "☮️"
    dates: "Oct 16 – 17"
    nights: "2 nights"
    image: "https://images.unsplash.com/photo-1768946579156-e29e7397b0bc?w=1200&h=600&fit=crop&q=80"
    days:
      - num: "DAY 7"
        date: "Oct 16"
        title: "Hiroshima — Peace + History"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Peace Memorial Museum"
            desc: "Shinkansen Kyoto → Hiroshima (~1.5h, JR Pass ✅). (¥200) — deeply powerful, allow 2–3 hrs. Peace Park & Atomic Bomb Dome."
            extended:
              full_desc: "One of the most powerful museums in the world, documenting the atomic bombing of Hiroshima on August 6, 1945. The renovated East Building presents personal stories with devastating clarity. The surrounding Peace Memorial Park contains the Atomic Bomb Dome (a UNESCO site), the Children's Peace Monument, and the cenotaph aligned to frame the dome. Allow time to sit and reflect."
              hours: "08:30–18:00 (until 19:00 Aug, 17:00 Dec–Feb)"
              time_needed: "2.5–3 hours"
              station: "Hiroshima Station (広島駅) — tram to Genbaku Dome-mae, 20 min"
              maps_query: "Hiroshima+Peace+Memorial+Museum"
              tips: "Go first thing in the morning to avoid afternoon crowds. The museum is emotionally intense — pace yourself. The Atomic Bomb Dome is most powerful at dusk. Rent a bicycle to explore the park area — Hiroshima is flat and bike-friendly."
          - tag: "quiet"
            tag_text: "Quiet"
            name: "Shukkei-en Garden"
            desc: "a 400-year-old miniature landscape garden in the heart of Hiroshima. Serene, almost always uncrowded, beautifully kept. 🌊"
            extended:
              full_desc: "A 400-year-old 'shuku-kei' (condensed scenery) garden that miniaturises famous Chinese landscape paintings into a compact strolling garden. Originally built in 1620 for the local feudal lord, it was destroyed by the atomic bomb and meticulously restored. The central pond with arched bridges, tea houses, and forested hills feels like a world away from the surrounding city."
              hours: "09:00–18:00 (until 17:00 Oct–Mar)"
              time_needed: "1–1.5 hours"
              station: "Shukkeien-mae tram stop — 1 min walk"
              maps_query: "Shukkei-en+Garden+Hiroshima"
              tips: "Perfect counterpoint to the intensity of the Peace Museum. The tea house serves matcha overlooking the pond (¥500). Almost never crowded — often you'll have entire sections to yourself. The autumn colours in late October are superb."
          - tag: "food"
            tag_text: "Dinner"
            name: "Okonomi-mura"
            desc: "6-floor building of Hiroshima-style okonomiyaki stalls. Each floor has its own family-run shop. 🥞"
            extended:
              full_desc: "A six-story building containing around 24 individual Hiroshima-style okonomiyaki stalls, each run by different families with their own recipes. Hiroshima-style is distinct from Osaka-style — ingredients are layered (not mixed), with a base of thin batter, mountain of cabbage, pork, yakisoba noodles, and egg. Watch the chefs cook right in front of you on the iron griddle."
              hours: "11:00–22:00"
              time_needed: "1 hour"
              station: "Hatchobori tram stop — 2 min walk"
              maps_query: "Okonomi-mura+Hiroshima"
              tips: "Go to the upper floors (4F–6F) where the locals eat and queues are shorter. A full okonomiyaki costs ¥800–1,200 — excellent value. Ask for extra noodles (soba or udon) and add cheese if adventurous. Beer + okonomiyaki is the classic Hiroshima combo."

      - num: "DAY 8"
        date: "Oct 17"
        title: "Miyajima Island"
        places:
          - tag: "main"
            tag_text: "All Day"
            name: "Miyajima"
            desc: "JR Ferry (JR Pass ✅). Itsukushima Shrine floating torii at high tide ⛩️. Hike Mt. Misen (1.5h) for sea views."
            extended:
              full_desc: "A sacred island in the Seto Inland Sea, famous for its 'floating' torii gate that appears to hover above the water at high tide. Itsukushima Shrine (UNESCO) is built on stilts over the tidal flats. Mt. Misen (535m) offers a challenging but rewarding hike through primeval forest to panoramic sea views. Wild deer roam freely on the island."
              hours: "Shrine: 06:30–18:00. Ropeway: 09:00–17:00"
              time_needed: "Full day (6–8 hours)"
              station: "Miyajimaguchi Station (宮島口駅) — JR, then 10 min ferry"
              maps_query: "Miyajima+Island+Hiroshima"
              tips: "Check tide tables — the torii gate 'floats' at high tide and you can walk to it at low tide. Both experiences are worth seeing. Take the ropeway up Mt. Misen and hike down (easier). The JR ferry route passes closest to the torii gate."
              activity:
                booking: "No booking needed. JR Ferry covered by JR Pass"
                cost: "¥1,000 ropeway one-way, shrine ¥300"
                duration: "Full day"
                what_to_bring: "Hiking shoes for Mt. Misen, water, sunscreen, camera"
          - tag: "quiet"
            tag_text: "Hidden Gem"
            name: "Daisho-in Temple"
            desc: "at the foot of Mt. Misen, past the tourist path. Spinning prayer wheels, stone Buddhas in knitted hats, multi-level sub-temples. Rarely crowded. 🙏"
            extended:
              full_desc: "An extraordinary multi-level temple complex at the base of Mt. Misen that most tourists walk right past on their way to the ropeway. Features hundreds of stone Rakan statues (each with a unique face, many wearing hand-knitted hats and scarves), Tibetan-style spinning prayer wheels, a fire-walking hall, a sand mandala, and a cave filled with 88 sacred icons representing the Shikoku pilgrimage. It's the most underrated site on Miyajima."
              hours: "08:00–17:00"
              time_needed: "45 minutes–1 hour"
              station: "Miyajima ferry terminal — 15 min walk south"
              maps_query: "Daisho-in+Temple+Miyajima"
              tips: "Spin every prayer wheel you pass (clockwise). The cave at the bottom level is atmospheric — don't skip it. The Rakan statues in knitted hats are incredibly photogenic. Almost always uncrowded compared to Itsukushima Shrine above."
          - tag: "food"
            tag_text: "Try"
            name: "Momiji Manju & Oysters"
            desc: "Momiji Manju (maple leaf cakes) 🍁 and freshly grilled oysters 🦪 from island stalls"
            extended:
              full_desc: "Miyajima's two signature foods. Momiji manju are maple-leaf-shaped cakes filled with red bean paste, custard, chocolate, or matcha — freshly baked and warm from the press. Grilled oysters from the Seto Inland Sea are enormous, sweet, and served with lemon and ponzu right at the waterfront stalls. October is peak oyster season."
              hours: "Most stalls 09:00–17:00"
              time_needed: "30 minutes (snacking while walking)"
              station: "Along Omotesando shopping street from ferry terminal"
              maps_query: "Miyajima+Omotesando+shopping+street"
              tips: "Try the freshly fried momiji manju (age-momiji) — crispy outside, molten inside. Oysters cost ¥200–400 each. The stalls near the ferry terminal are freshest. Buy a mixed box of momiji manju as omiyage (souvenirs)."

  - name: "Okinawa"
    jp: "沖縄"
    flag: "🌊"
    dates: "Oct 18 – 21"
    nights: "3 nights"
    image: "https://images.unsplash.com/photo-1754228811035-d220f70b86d9?w=1200&h=600&fit=crop&q=80"
    days:
      - num: "DAY 9"
        date: "Oct 18"
        title: "Arrive Okinawa — Naha & Shuri"
        places:
          - tag: "main"
            tag_text: "Afternoon"
            name: "Shuri Castle"
            desc: "首里城 — the vibrant red-lacquered palace of the Ryukyu Kingdom. A UNESCO World Heritage site with an aesthetic utterly distinct from mainland Japan. (¥400) 🏯"
            extended:
              full_desc: "The reconstructed royal palace of the Ryukyu Kingdom (1429–1879), which ruled Okinawa as an independent trading nation between Japan, China, and Southeast Asia. The architecture is a stunning fusion of Chinese and Japanese styles — vermillion walls, dragon reliefs, and sweeping curved roofs. The original was destroyed in WWII and again in a 2019 fire; reconstruction is ongoing, adding a layer of resilience to the visit."
              hours: "08:30–18:00 (until 19:00 Jul–Sep)"
              time_needed: "1.5–2 hours"
              station: "Shuri Station (首里駅) — Yui Rail monorail, 15 min walk"
              maps_query: "Shuri+Castle+Naha+Okinawa"
              tips: "The underground stone foundations and walls survived both the war and fire — they're the most historically significant part. The panoramic views of Naha from the castle walls are superb. Visit in the afternoon when the red lacquer glows in warm light."
          - tag: "food"
            tag_text: "Evening"
            name: "Makishi Public Market"
            desc: "choose fresh seafood from the 1F stalls, take it upstairs to a 2F restaurant who cooks it for you. A genuine Okinawan tradition. 🐟"
            extended:
              full_desc: "Naha's legendary public market, running since the post-war era. The system is unique: browse the ground floor's colourful stalls of tropical fish, sea grapes, pig faces, and exotic fruit; pick your ingredients; then carry them upstairs to a second-floor restaurant that will cook them for you (for a small fee). It's the most authentic culinary experience in Okinawa."
              hours: "08:00–21:00 (2F restaurants until 22:00)"
              time_needed: "1.5–2 hours"
              station: "Makishi Station (牧志駅) — Yui Rail, 5 min walk"
              maps_query: "Makishi+Public+Market+Naha+Okinawa"
              tips: "The cooking fee is typically ¥500 per item. Try gurukun (Okinawan butterfly fish), umi-budo (sea grapes), and sashimi. The market recently moved to a new building — same vendors, modern facilities. Budget ¥2,000–3,000 total."

      - num: "DAY 10"
        date: "Oct 19"
        title: "Limestone Cliffs & Hidden Caves"
        places:
          - tag: "quiet"
            tag_text: "Very Quiet"
            name: "Cape Manzamo"
            desc: "(万座毛) — dramatic limestone cliffs carved by the sea into an elephant-trunk arch. Wild flowers, free entry, morning crowds near zero. Arrive at sunrise for the full drama. 🌊"
            extended:
              full_desc: "A dramatic coastal promontory on Okinawa's west coast, where limestone cliffs have been carved by wind and waves into an iconic elephant-trunk-shaped arch. The name means '10,000 people can sit' — referring to the vast grassy plateau atop the cliffs. Wild subtropical flowers bloom year-round, and the turquoise sea below is mesmerising. At sunrise, the light hitting the coral reef below creates an otherworldly palette."
              hours: "08:00–sunset (free, open area)"
              time_needed: "45 minutes–1 hour"
              station: "No rail — 70 min drive from Naha (or bus 20/120)"
              maps_query: "Cape+Manzamo+Okinawa"
              tips: "Arrive at sunrise for the most dramatic light and zero crowds. Combine with nearby Manza Beach for a morning swim. The walking path is paved and wheelchair accessible. Free parking available."
          - tag: "quiet"
            tag_text: "Hidden"
            name: "Ryugudo Cave"
            desc: "450m illuminated limestone cave inside a hill in central Okinawa. Atmospheric, rarely visited by foreign tourists. ¥1,200"
            extended:
              full_desc: "A 450-metre illuminated limestone cave formed over 300,000 years, located in central Okinawa. The cave features dramatic stalactites, stalagmites, and underground pools lit with atmospheric coloured lighting. Unlike the more famous Gyokusendo Cave, Ryugudo receives very few foreign visitors, making it a genuinely peaceful underground experience."
              hours: "09:00–17:30 (last entry 17:00)"
              time_needed: "30–45 minutes"
              station: "No rail — 40 min drive from Naha"
              maps_query: "Ryugudo+Cave+Okinawa"
              tips: "The cave is cool inside (~18°C year-round) — bring a light layer. Photography is allowed. The limestone formations near the exit are the most impressive. Combine with Katsuren Castle ruins nearby."
          - tag: "quiet"
            tag_text: "UNESCO"
            name: "Katsuren Castle Ruins"
            desc: "hilltop Ryukyuan fortress with 360° panoramic views over the turquoise sea. UNESCO listed, almost always uncrowded. Free outer grounds. 🏰"
            extended:
              full_desc: "The ruins of a 12th-century Ryukyuan castle perched on a rocky promontory overlooking the Pacific Ocean. Built by the powerful lord Amawari, who controlled maritime trade routes to China and Southeast Asia. The UNESCO-listed stone walls wind up the hillside to a summit platform with 360° views of turquoise sea and offshore islands. Roman coins were excavated here — evidence of ancient global trade connections."
              hours: "Grounds: 24/7. Museum: 09:00–18:00"
              time_needed: "1–1.5 hours"
              station: "No rail — 50 min drive from Naha"
              maps_query: "Katsuren+Castle+Ruins+Okinawa"
              tips: "The climb to the top is steep but short (15 min). The museum at the base provides excellent context. Best visited in late afternoon when the sun illuminates the sea. Free entry to the ruins; museum ¥600."

      - num: "DAY 11"
        date: "Oct 20"
        title: "Beaches + Churaumi Aquarium"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Manza Beach / Moon Beach"
            desc: "in Onna Village — Okinawa's crystal clear water 🏖️. October is still warm (~26°C) and far less crowded than peak summer."
            extended:
              full_desc: "Two of Okinawa's finest beaches on the west coast of Onna Village. Manza Beach has a dramatic cliff backdrop and coral reef for snorkelling, while Moon Beach is a crescent-shaped bay with calm, crystal-clear water. October sea temperature is around 26°C — perfect for swimming without the summer crowds. The coral reef offshore is home to tropical fish visible in just knee-deep water."
              hours: "Beach access: 24/7. Facilities: 09:00–18:00"
              time_needed: "2–3 hours"
              station: "No rail — 60 min drive from Naha"
              maps_query: "Manza+Beach+Onna+Village+Okinawa"
              tips: "Bring reef-safe sunscreen. Snorkel gear rental available at both beaches (~¥1,000). Moon Beach is calmer for swimming; Manza has better snorkelling. The water clarity in October is often better than summer. Consider renting a car for the day."
              activity:
                booking: "No booking needed for beach access. Snorkel/kayak tours bookable same-day"
                cost: "Free beach access. Snorkel rental ¥1,000, kayak ¥3,000"
                duration: "2–3 hours"
                what_to_bring: "Swimsuit, towel, reef-safe sunscreen, waterproof phone case"
          - tag: "main"
            tag_text: "Afternoon"
            name: "Churaumi Aquarium"
            desc: "(美ら海水族館) — one of the world's largest, with an 8.2m deep tank housing whale sharks (¥2,180). The adjacent Emerald Beach inside the park is free and stunning."
            extended:
              full_desc: "One of the world's largest and most spectacular aquariums, centred around the massive Kuroshio Sea tank — 35m long, 27m wide, and 10m deep, holding 7,500 cubic metres of water, three whale sharks, and manta rays. The tank wall is a single acrylic panel and watching whale sharks glide past is unforgettable. The adjacent Ocean Expo Park includes the free Emerald Beach and a reconstructed traditional Okinawan village."
              hours: "08:30–18:30 (until 20:00 in summer)"
              time_needed: "2.5–3 hours"
              station: "No rail — 2 hour drive from Naha (or express bus)"
              maps_query: "Churaumi+Aquarium+Okinawa"
              tips: "Buy tickets at a convenience store (Lawson, FamilyMart) for a ¥200 discount. The whale shark feeding happens at 15:00 and 17:00 — position yourself at the café seats facing the tank. After 16:00, discounted entry is available. The Emerald Beach in the park is one of Okinawa's best — and free."

      - num: "DAY 12"
        date: "Oct 21"
        title: "Sacred Forest Shrine + Depart for Tokyo"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Himeyuri Peace Museum"
            desc: "memorial to student nurses in WWII. Quieter and more intimate than Hiroshima's museum. ¥310"
            extended:
              full_desc: "A deeply moving memorial to the Himeyuri Student Corps — 222 female high school students and 18 teachers conscripted as nurses during the Battle of Okinawa in 1945. The museum tells their personal stories through letters, photographs, and testimonies from the few survivors. The adjacent cave was used as a field hospital. It's quieter and more intimate than Hiroshima's Peace Museum, and uniquely Okinawan in perspective."
              hours: "09:00–17:25 (last entry 17:00)"
              time_needed: "1–1.5 hours"
              station: "No rail — 30 min drive from Naha (bus 89)"
              maps_query: "Himeyuri+Peace+Museum+Okinawa"
              tips: "Read the English pamphlet carefully — the personal stories are extraordinarily moving. The cave outside is small but worth seeing. Allow time to sit and process. Photography is not permitted inside the museum."
          - tag: "quiet"
            tag_text: "UNESCO · Sacred"
            name: "Sefa-utaki"
            desc: "(斎場御嶽) — Okinawa's most sacred Ryukyuan shrine, hidden in a lush forest of ancient banyan trees. Enter through mossy limestone rock formations into a space that feels genuinely ancient. ¥300. 🌳"
            extended:
              full_desc: "The most sacred site in the Ryukyuan religion — a UNESCO World Heritage shrine hidden within a primeval forest of ancient banyan and gajumaru trees. No buildings; instead, massive triangular limestone formations create natural cathedral-like spaces. The main sanctuary is a narrow gap between two towering rocks, through which you glimpse Kudaka Island — considered the island of the gods. Kings and priestesses performed rituals here for centuries."
              hours: "09:00–18:00 (Mar–Oct), 09:00–17:30 (Nov–Feb)"
              time_needed: "45 minutes–1 hour"
              station: "No rail — 50 min drive from Naha"
              maps_query: "Sefa-utaki+Okinawa"
              tips: "Wear shoes with grip — the limestone paths are slippery when wet. The triangular rock formation at the end is the holiest spot; be respectful and quiet. Visit early morning for the most atmospheric light through the forest canopy. The visitor centre provides essential context."
          - tag: "main"
            tag_text: "Evening"
            name: "Flight to Tokyo"
            desc: "✈ Fly OKA → NRT with Jetstar Japan (~3 hrs). Arrive Tokyo night."
            extended:
              full_desc: "Evening flight from Naha Airport (OKA) to Tokyo Narita Airport (NRT) with Jetstar Japan. The flight takes approximately 2.5–3 hours. From Narita, take the Narita Express or Keisei Skyliner to central Tokyo (~60 min)."
              hours: "Check-in opens 2 hours before departure"
              time_needed: "Allow 2 hours at airport + 3 hours flight + 1 hour to hotel"
              station: "Naha Airport (那覇空港) — Yui Rail from city centre, 15 min"
              maps_query: "Naha+Airport+Okinawa"
              tips: "Naha Airport has excellent last-chance Okinawan food and souvenir shops after security. Buy chinsuko cookies and purple sweet potato tarts as omiyage. At Narita, the last Skyliner departs at 22:30."

  - name: "Tokyo"
    jp: "東京"
    flag: "🗼"
    dates: "Oct 21 – 24"
    nights: "3 nights"
    image: "https://images.unsplash.com/photo-1764418658791-771bb04efdcd?w=1200&h=600&fit=crop&q=80"
    days:
      - num: "DAY 13"
        date: "Oct 22"
        title: "Old Tokyo — Asakusa & Yanaka"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Senso-ji Temple"
            desc: "Tokyo's oldest Buddhist temple. Arrive before 7am to see it in the mist, before tourists arrive. Nakamise-dori shopping street."
            extended:
              full_desc: "Tokyo's oldest and most visited Buddhist temple, founded in 628 AD. The massive Kaminarimon (Thunder Gate) with its iconic giant red lantern leads to Nakamise-dori — a 250m shopping street selling traditional snacks and souvenirs. The main hall is spectacular, and the five-story pagoda is beautifully lit at night. Before 7am, the temple grounds are nearly empty and often shrouded in mist."
              hours: "Temple grounds: 24/7. Main hall: 06:00–17:00"
              time_needed: "1.5–2 hours"
              station: "Asakusa Station (浅草駅) — 1 min walk"
              maps_query: "Senso-ji+Temple+Asakusa+Tokyo"
              tips: "Arrive before 7am for the misty, tourist-free experience. Nakamise shops open around 10am. Try the freshly made ningyo-yaki (filled cakes) and thunder crackers. The area around Hoppy Street south of the temple has excellent, cheap izakayas."
          - tag: "quiet"
            tag_text: "Very Quiet"
            name: "Yanaka Ginza"
            desc: "Tokyo's most nostalgic old shopping street. Tofu shops, sembei cracker stalls, cats dozing on rooftops. Almost no tourists despite being walkable from central Tokyo. 🐱"
            extended:
              full_desc: "A lovingly preserved old-school Tokyo shopping street that survived the war and modernisation. Small family-run shops sell handmade tofu, rice crackers (sembei), croquettes, and traditional crafts. Cats are the unofficial mascots — you'll spot them sleeping on rooftops and in doorways. The Yanaka Cemetery nearby has beautiful cherry trees and a meditative atmosphere. It's Tokyo's most nostalgic neighbourhood."
              hours: "Most shops 10:00–18:00 (cafes from 08:00)"
              time_needed: "1.5–2 hours"
              station: "Nippori Station (日暮里駅) — 5 min walk downhill"
              maps_query: "Yanaka+Ginza+Tokyo"
              tips: "Enter from the Nippori Station side (downhill) for the best approach — the famous 'Yuyake Dandan' sunset stairs have a perfect view of the street below. Try the ¥70 menchi-katsu (fried meat patty) at the top of the stairs. Sunday mornings are quietest."
          - tag: "quiet"
            tag_text: "Quiet"
            name: "Koenji"
            desc: "evening — Tokyo's indie/bohemian district. Antique shops, vinyl record stores, great izakayas, zero tourist vibe. 🎸"
            extended:
              full_desc: "A bohemian neighbourhood on the Chuo Line known for its second-hand clothing stores, vinyl record shops, independent music venues, and friendly neighbourhood izakayas. It has a creative, slightly anarchic energy — street art, tiny live houses, and some of Tokyo's best thrift shopping. The annual Awa Odori dance festival in August draws huge crowds, but the rest of the year it's blissfully untouristy."
              hours: "Shops 12:00–20:00, bars and izakayas 17:00–late"
              time_needed: "2–3 hours (evening)"
              station: "Koenji Station (高円寺駅) — JR Chuo Line"
              maps_query: "Koenji+Tokyo"
              tips: "Start at the south exit and wander the covered shopping arcade. The record shops on Look Street are excellent. For izakayas, walk north of the station. Don't miss the tiny standing bars (tachinomi) — cheapest drinks in Tokyo."

      - num: "DAY 14"
        date: "Oct 23"
        title: "Modern Tokyo + Last Shopping"
        places:
          - tag: "food"
            tag_text: "Breakfast"
            name: "Tsukiji Outer Market"
            desc: "sushi breakfast at 7am 🍣. The inner market moved to Toyosu, but the outer market remains vibrant and authentic."
            extended:
              full_desc: "The outer market surrounding the former Tsukiji fish market remains one of Tokyo's greatest food destinations. Hundreds of small shops and restaurants serve the freshest sushi, tamago (egg omelette), oysters, and seafood in the city. The atmosphere is bustling and authentic — professional chefs and home cooks shop alongside tourists. Sushi for breakfast here is a quintessential Tokyo experience."
              hours: "05:00–14:00 (most shops). Best before 10am"
              time_needed: "1–1.5 hours"
              station: "Tsukiji Station (築地駅) — 1 min walk"
              maps_query: "Tsukiji+Outer+Market+Tokyo"
              tips: "Go before 8am for the best selection and shortest queues. Sushi Dai and Daiwa are famous but have 2+ hour waits — try the smaller shops like Tsukiji Sushi-Sei for equal quality with no wait. Budget ¥2,000–4,000 for a proper sushi breakfast."
          - tag: "quiet"
            tag_text: "Hidden"
            name: "Hamarikyu Gardens"
            desc: "a 300-year-old shogunate garden surrounded by skyscrapers. A surreal, peaceful contrast in central Tokyo. ¥300 🏯"
            extended:
              full_desc: "A beautifully preserved 250,000 sqm garden from the Edo period, originally a duck hunting ground for the Tokugawa shoguns. The centrepiece is a large tidal pond connected to Tokyo Bay — the water level rises and falls with the ocean tides. The tea house on the island in the middle of the pond serves matcha surrounded by skyscrapers — one of Tokyo's most surreal and beautiful contrasts."
              hours: "09:00–17:00 (last entry 16:30)"
              time_needed: "1–1.5 hours"
              station: "Shiodome Station (汐留駅) — 5 min walk"
              maps_query: "Hamarikyu+Gardens+Tokyo"
              tips: "The matcha tea on the island (¥510) is one of Tokyo's best value experiences — served with a sweet, overlooking the tidal pond with skyscrapers behind. You can take a water bus directly from here to Asakusa (¥860, 35 min)."
          - tag: "main"
            tag_text: "Afternoon"
            name: "Shibuya"
            desc: "Shibuya Scramble Crossing + Shibuya Sky observation deck at sunset (¥2,000)"
            extended:
              full_desc: "The world's busiest pedestrian crossing — up to 3,000 people cross simultaneously every two minutes during peak hours. Watch from the Starbucks above (2F of Tsutaya building) or from Shibuya Sky, a rooftop observation deck at 229m with a stunning open-air terrace. At sunset, the city transforms into a sea of lights. The Hachiko statue at the station exit is Tokyo's most famous meeting spot."
              hours: "Shibuya Sky: 09:00–22:45 (last entry 21:20)"
              time_needed: "2–3 hours"
              station: "Shibuya Station (渋谷駅) — all major lines"
              maps_query: "Shibuya+Scramble+Crossing+Tokyo"
              tips: "Book Shibuya Sky online in advance — sunset timeslots sell out. The open-air terrace on the rooftop is the highlight (weather permitting). The Scramble Crossing is most impressive at night with all the neon. The nearby Nonbei Yokocho (Drunkard's Alley) has tiny atmospheric bars."
          - tag: "quiet"
            tag_text: "Quiet"
            name: "Shimokitazawa"
            desc: "Tokyo's indie music and vintage fashion neighbourhood. No chain stores, no tourists, great record shops and pour-over coffee. 🎶"
            extended:
              full_desc: "Tokyo's most beloved indie neighbourhood — a maze of narrow streets packed with vintage clothing shops, record stores, independent coffee roasters, small theatre companies, and live music venues. Recently redeveloped with the Bonus Track complex (open-air micro-shops) and Shimokita Ekiue (station-top market). Despite gentrification, it retains its anti-mainstream, creative spirit. Zero chain stores, zero tourist infrastructure."
              hours: "Shops 12:00–20:00. Bars and live houses: 18:00–late"
              time_needed: "2–3 hours"
              station: "Shimokitazawa Station (下北沢駅) — Keio Inokashira or Odakyu Line"
              maps_query: "Shimokitazawa+Tokyo"
              tips: "The best vintage shops are on the south side. Check live house schedules at Shelter, BASEMENTBAR, or THREE — tickets are ¥1,500–3,000. Bonus Track complex has excellent coffee and a tiny bookshop. Bear Pond Espresso is legendary (but the owner is famously grumpy — that's part of the charm)."

      - num: "DAY 15"
        date: "Oct 24"
        title: "Departure Day"
        places:
          - tag: "main"
            tag_text: "05:45 IST"
            name: "Departure Flight 1"
            desc: "✈ XJ 601 departs Tokyo NRT → Bangkok DMK (arrives 13:10 IST)"
            extended:
              full_desc: "Thai AirAsia X flight XJ 601 from Narita International Airport to Bangkok Don Mueang Airport. Flight duration approximately 6.5 hours. Budget airline — meals and checked baggage are extra."
              hours: "Departs 05:45 (arrive airport by 03:45)"
              time_needed: "8 hours total (airport + flight)"
              station: "Narita Airport (成田空港)"
              maps_query: "Narita+Airport+Tokyo"
              tips: "The earliest Narita Express doesn't run this early — take the Keisei line or pre-book a shared shuttle van. Alternatively, stay at a hotel near Narita the night before. Check in online 14 days before departure."
          - tag: "main"
            tag_text: "18:50 IST"
            name: "Departure Flight 2"
            desc: "✈ FD 170 departs Bangkok DMK → Kochi COK (arrives 22:30 IST). Home. 🏠"
            extended:
              full_desc: "Thai AirAsia flight FD 170 from Bangkok Don Mueang to Cochin International Airport. Flight duration approximately 3.5 hours. Short layover at DMK between flights."
              hours: "Departs 18:50 IST (arrives 22:30 IST)"
              time_needed: "5 hours (layover + flight)"
              station: "Don Mueang Airport (DMK)"
              maps_query: "Don+Mueang+Airport+Bangkok"
              tips: "DMK has decent food courts on the 3rd floor. If the layover is long, the Magic Food Point outside arrivals has cheap Thai food. Stay landside if connecting on AirAsia — the transit process is straightforward."
