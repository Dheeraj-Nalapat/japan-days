cities:
  - name: "Osaka"
    jp: "大阪"
    flag: "🏯"
    lat: 34.6937
    lng: 135.5023
    dates: "Oct 11 – 15"
    nights: "4 nights"
    base: "Hommachi"
    style: "quiet/history days · food nights"
    image: "https://images.unsplash.com/photo-1759746334715-fae30ec56600?w=1200&h=600&fit=crop&q=80"
    days:
      - num: "DAY 1"
        date: "Oct 11"
        title: "Arrival — Arrive KIX 18:25 local"
        places:
          - tag: "main"
            tag_text: "Transit"
            name: "Nankai Rapi:t / Haruka Express"
            desc: "KIX to Hommachi (~60 min, ¥1,450–1,880). Check in to hostel private room."
            image: "https://images.unsplash.com/photo-1554995207-c18c203602cb?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Two excellent airport express options connect KIX to central Osaka. Nankai Rapi:t (the retro-futuristic blue train) goes to Namba in 34 minutes. Haruka Express runs to Tennoji and Shin-Osaka via JR. Both offer reserved seating and luggage space. From Namba or Tennoji, transfer to the Midosuji Line to reach Hommachi in 5 minutes."
              hours: "Runs every 30 min, 06:30–22:16"
              time_needed: "60 minutes to Hommachi"
              station: "Kansai Airport Station (関西空港駅)"
              maps_query: "Kansai+Airport+Station+Osaka"
              tips: "Load ¥5,000 on a Suica/ICOCA IC Card at the airport. No nationwide JR Pass this trip — buy point-to-point shinkansen tickets later (cheaper for this route)."
          - tag: "main"
            tag_text: "Evening"
            name: "Dotonbori"
            desc: "first taste of Osaka's neon chaos. Walk Ebisu-bashi bridge, Glico sign. Takoyaki at Kukuru 🐙"
            image: "https://images.unsplash.com/photo-1553621042-f6e147245754?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Osaka's most iconic entertainment district — a sensory overload of giant neon signs, mechanical crabs, and the famous Glico Running Man. The canal reflects all the lights at night, creating a mesmerising atmosphere. Street food stalls line both sides of the river."
              hours: "24/7 (most shops 11:00–23:00)"
              time_needed: "1.5–2 hours"
              station: "Namba Station (M20) — 3 stops, 5 min from Hommachi"
              maps_query: "Dotonbori+Osaka"
              tips: "Go after 8pm for the full neon effect. Takoyaki at Kukuru is reliable, but Wanaka is the local favourite."
          - tag: "quiet"
            tag_text: "Hidden"
            name: "Hozenji Yokocho"
            desc: "duck into this lantern-lit mossy alley right beside Dotonbori. Moss-covered Fudo Myo-o statue — feels like a different century. 🕯️"
            image: "https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A narrow, stone-paved alley centered around Hozenji Temple with its famous moss-covered Fudo Myo-o statue. Visitors splash water on the statue for good luck, and centuries of this practice have given it a thick, sacred moss coating. Just 50 metres from Dotonbori chaos, yet feels like a completely different century."
              hours: "24/7 (restaurants typically 17:00–23:00)"
              time_needed: "20–30 minutes"
              station: "Namba Station (M20) — 3 min walk"
              maps_query: "Hozenji+Yokocho+Osaka"
              tips: "Visit after dark for the lantern-lit atmosphere. Perfect for a quiet nightcap after the Dotonbori madness."

      - num: "DAY 2"
        date: "Oct 12"
        title: "Osaka City — History + Hidden"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Osaka Castle Grounds + Nishinomaru Garden"
            desc: "(¥200) — arrive before 9am. Walk the moat paths, Sakuramon Gate, autumn foliage in the garden. Grounds are the real experience. 🍁"
            image: "https://images.unsplash.com/photo-1589452271712-a1d253989834?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "One of Japan's most famous landmarks, originally built in 1583 by Toyotomi Hideyoshi. The surrounding Nishinomaru Garden is the real highlight in October — 300 cherry trees turn golden, and the moat reflects the castle perfectly. No tower entry needed — the grounds are the real experience."
              hours: "09:00–17:00 (last entry 16:30). Nishinomaru Garden ¥200"
              time_needed: "1.5–2 hours"
              station: "Tanimachi 4-chome (T23) — 4 stops, 8 min from Hommachi"
              maps_query: "Osaka+Castle+Nishinomaru+Garden"
              tips: "Arrive at 9am opening to beat tour groups. Skip the castle interior — the park grounds are the main attraction in autumn."
          - tag: "quiet"
            tag_text: "Hidden"
            name: "Nakazaki-cho"
            desc: "Osaka's bohemian quarter. Old wooden machiya townhouses, vintage coffee shops, indie bakeries. Almost zero foreign tourists. ☕"
            image: "https://images.unsplash.com/photo-1770284212085-20ef07376ffa?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A retro neighbourhood of pre-war wooden machiya townhouses converted into indie coffee shops, vintage clothing stores, art galleries, and tiny bars. It's Osaka's answer to Shimokitazawa — deeply local, almost entirely undiscovered by foreign tourists."
              hours: "Most shops 11:00–19:00 (cafes from 08:00)"
              time_needed: "1.5–2 hours"
              station: "Nakazakinishi (T21) — 5 stops, 10 min from Hommachi"
              maps_query: "Nakazakicho+Osaka"
              tips: "Start at Salon de AManTo for excellent pour-over coffee in a 100-year-old house. Wander without a map — the charm is in getting lost."
          - tag: "food"
            tag_text: "Lunch"
            name: "Kuromon Ichiba Market"
            desc: "Osaka's kitchen — fresh sashimi, grilled scallops, wagyu skewers straight from the stalls. 🐟"
            image: "https://images.unsplash.com/photo-1552611052-33e04de16ea3?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Known as 'Osaka's Kitchen' for over 190 years, this 600-metre covered market has around 170 shops selling the freshest seafood, produce, and street food in the city."
              hours: "09:00–18:00 (some stalls close earlier)"
              time_needed: "1–1.5 hours"
              station: "Nipponbashi (S17) — 4 stops, 7 min from Hommachi"
              maps_query: "Kuromon+Ichiba+Market+Osaka"
              tips: "Go before 11am to avoid crowds. Budget ¥2,000–3,000 for a full seafood lunch across multiple stalls."
          - tag: "main"
            tag_text: "Evening"
            name: "Shinsekai"
            desc: "retro neon district from 6pm. Kushikatsu at Daruma (no double dipping the sauce 🚫). Walk under Tsutenkaku Tower. 🍢"
            image: "https://images.unsplash.com/photo-1556978395-8a06f6f29bfc?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A retro entertainment district built around Tsutenkaku Tower, designed in the early 1900s. Today it's a gloriously kitschy, neon-lit maze of kushikatsu restaurants, old-school gaming arcades, and public baths."
              hours: "Most shops 11:00–22:00"
              time_needed: "1.5–2 hours"
              station: "Dobutsuen-mae (M22) — 6 stops, 12 min from Hommachi"
              maps_query: "Shinsekai+Osaka"
              tips: "The golden rule of kushikatsu: never double-dip in the communal sauce. Daruma is famous, but Yaekatsu is the local pick."

      - num: "DAY 3"
        date: "Oct 13"
        title: "Nara Day Trip — Deer, Temples & Gardens"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Nara Deer Park"
            desc: "40 min Kintetsu from Namba (¥680). Hundreds of free-roaming deer — feed them shika senbei crackers (¥200/pack). 🦌"
            image: "https://images.unsplash.com/photo-1528360983277-13d401cdc186?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Japan's first permanent capital (710–784 AD), now a peaceful city where over 1,200 wild deer roam freely through the parks and temple grounds. The deer are considered divine messengers and bow when you offer them crackers."
              hours: "Park: 24/7. Deer crackers from 08:00"
              time_needed: "1 hour"
              station: "Kintetsu Nara Station — 40 min from Namba (¥680)"
              maps_query: "Nara+Deer+Park+Japan"
              tips: "Buy deer crackers (¥200) from official vendors only. Bow to the deer — they'll bow back. Don't carry food in open bags."
          - tag: "main"
            tag_text: "Morning"
            name: "Todai-ji Temple"
            desc: "giant Buddha hall — largest wooden building in the world (¥600). 🏛️"
            image: "https://images.unsplash.com/photo-1624601573012-1f28b060263a?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Houses a 15-metre bronze Buddha in the world's largest wooden building. The scale is staggering — the main hall is 48 metres high and the Buddha weighs 500 tonnes. Rebuilt twice after fires, the current structure dates from 1709."
              hours: "07:30–17:30"
              time_needed: "1 hour"
              station: "Kintetsu Nara Station — 15 min walk"
              maps_query: "Todai-ji+Temple+Nara"
              tips: "Try to squeeze through the pillar hole at the back — legend says it brings enlightenment."
          - tag: "quiet"
            tag_text: "Hidden"
            name: "Isuien Garden"
            desc: "strolling garden that uses Todai-ji's roof as 'borrowed scenery.' Most visitors walk right past. ¥1,200. 🌿"
            image: "https://images.unsplash.com/photo-1748525591561-f19fdfe637b5?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "An exquisite Meiji-era strolling garden using the 'shakkei' (borrowed scenery) technique to frame Todai-ji's massive roof and the surrounding hills as part of its composition."
              hours: "09:30–16:30 (closed Tuesdays)"
              time_needed: "45 minutes"
              station: "Between Todai-ji and central Nara — easy to miss"
              maps_query: "Isuien+Garden+Nara"
              tips: "The tea house serves matcha with a view of Todai-ji's roof (¥500 extra). Closed Tuesdays."
          - tag: "quiet"
            tag_text: "Afternoon"
            name: "Naramachi old town"
            desc: "lattice-fronted merchant townhouses, tiny craft shops and cafés in the former merchant quarter. Unhurried, almost no crowds. 🏮"
            image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "The former merchant district of Nara, a grid of narrow lanes lined with preserved Edo-period machiya townhouses. Many now house craft shops, galleries, sake makers, and quiet cafés. Look for the red 'migawari-zaru' monkey charms hanging from the eaves."
              hours: "Most shops 10:00–17:00"
              time_needed: "1–1.5 hours"
              station: "10 min walk south of Sarusawa Pond"
              maps_query: "Naramachi+Nara"
              tips: "A relaxed way to close the Nara day before the Kintetsu ride back to Osaka. Try kakinoha-zushi (persimmon-leaf sushi) or warabi-mochi here."

      - num: "DAY 4"
        date: "Oct 14"
        title: "Koyasan Overnight — Mountain Monastery"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Free Morning in Osaka"
            desc: "Denden Town (Osaka's Akihabara — anime/electronics) or Tsuruhashi Koreatown (yakiniku, kimchi market). 🎮"
            image: "https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Two excellent options for a free morning: Denden Town is Osaka's electronics and otaku district — retro game shops, anime figures, and electronics at great prices. Tsuruhashi Koreatown is Japan's largest Korea Town — packed with yakiniku BBQ restaurants, kimchi markets, and K-pop merch shops."
              hours: "Most shops open 10:00–20:00"
              time_needed: "2–3 hours"
              station: "Denden Town: Nipponbashi (S17). Tsuruhashi: Tsuruhashi (S19)"
              maps_query: "Denden+Town+Osaka"
              tips: "Denden Town is less crowded and more retro than Akihabara. Leave your big bag at the hostel — carry only an overnight bag to Koyasan."
          - tag: "main"
            tag_text: "Afternoon"
            name: "Train to Koyasan"
            desc: "Nankai Koya Line from Namba → Gokurakubashi → cable car → Koyasan (~2hrs, ¥2,000). A UNESCO mountain monastery town. 🌲"
            image: "https://images.unsplash.com/photo-1578469550956-0e16b69c6a3d?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Koyasan (Mount Koya) is a UNESCO World Heritage sacred mountain town founded in 816 AD by Kobo Daishi, the father of Shingon Buddhism. The journey itself is spectacular — the train climbs through forested valleys, ending with a steep cable car ascent through cedar forest to the 800-metre mountaintop plateau where 117 temples reside."
              hours: "Trains run 06:00–21:30. Cable car every 20 min"
              time_needed: "2 hours transit"
              station: "Namba Station → Gokurakubashi → Cable car → Koyasan"
              maps_query: "Koyasan+Mount+Koya+Japan"
              tips: "Take the 3–4pm train to arrive with enough daylight for Okunoin. Buy the Nankai Koyasan World Heritage Ticket (~¥3,140 round trip incl. cable car + buses)."
          - tag: "quiet"
            tag_text: "Very Quiet"
            name: "Okunoin Cemetery"
            desc: "walk the 2km lantern-lit path through ancient cedar trees past 200,000 tombstones at dusk. One of the most atmospheric places in Japan. 🌲"
            image: "https://images.unsplash.com/photo-1601823984263-b87b59798b70?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Japan's largest cemetery and one of its most sacred sites — a 2km path through towering 600-year-old cedar trees, past 200,000 tombstones and memorial pagodas of samurai, monks, and historical figures spanning over 1,000 years. At dusk, stone lanterns are lit along the path, creating an otherworldly atmosphere. At the end, the Torodo Hall of Lamps houses 10,000 eternally burning lanterns."
              hours: "24/7, free admission. Lanterns lit from dusk"
              time_needed: "1.5–2 hours"
              station: "Okunoin-mae bus stop from Koyasan centre"
              maps_query: "Okunoin+Cemetery+Koyasan"
              tips: "Visit at dusk for the lantern-lit experience. The path is atmospheric even in rain. Walk slowly and respectfully. The final hall (Torodo) with 10,000 burning lamps is extraordinary."
          - tag: "main"
            tag_text: "Night"
            name: "Shukubo — Temple Stay"
            desc: "overnight in a Buddhist monastery. Tatami rooms, vegetarian shojin ryori dinner, futon bedding. Morning prayer at 6am. 🛕"
            image: "https://images.unsplash.com/photo-1580537659466-0a9bfa916a54?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A shukubo is a temple lodging experience unique to Koyasan. You sleep in a traditional tatami room with futon bedding, eat exquisite vegetarian shojin ryori cuisine (Buddhist temple cuisine), and can optionally attend the morning prayer ceremony at 6am. It's one of the most memorable overnight experiences in Japan."
              hours: "Check-in 15:00–17:00, dinner 17:30, breakfast 07:00"
              time_needed: "Overnight"
              station: "Various temples in Koyasan town centre"
              maps_query: "Koyasan+shukubo+temple+stay"
              tips: "Book at koyasan-shukubo.net (official portal). Eko-in for the morning Goma fire ritual; Shojoshin-in is cheapest and next to Okunoin; Fukuchi-in has a natural onsen. Book early — October sells out."

      - num: "DAY 5"
        date: "Oct 15"
        title: "Koyasan Morning → Kobe Afternoon"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Koyasan Morning Prayer"
            desc: "monks' prayer ceremony at 6am (optional, highly recommended) → vegetarian breakfast → leave by 9am. 🌄"
            image: "https://images.unsplash.com/photo-1578469550956-0e16b69c6a3d?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "The morning ajikan (fire prayer) ceremony is a profoundly atmospheric experience — monks chant sutras in a candlelit hall while incense fills the air. Even without understanding the words, the rhythmic chanting and flickering flames create a deeply meditative atmosphere. Followed by a traditional vegetarian breakfast in the dining hall."
              hours: "Prayer: 06:00–06:30. Breakfast: 07:00"
              time_needed: "2 hours (prayer + breakfast + departure)"
              station: "Koyasan town centre"
              maps_query: "Koyasan+morning+prayer"
              tips: "Set an alarm — the prayer starts at exactly 6am. Sit in seiza (kneeling) if you can, but cross-legged is fine. Photography not allowed during the ceremony. Back in Osaka by ~11am, then continue to Kobe."
          - tag: "main"
            tag_text: "Afternoon"
            name: "Kobe — Kitano Ijinkan"
            desc: "~40 min from Osaka. Western-style foreign residences on the hillside, quiet streets with sea views. Also a Suzume anime transit-arc location. 🌊"
            image: "https://images.unsplash.com/photo-1592806088932-05058af0ad8d?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A hillside neighbourhood of ornate Western-style residences built by foreign traders in the late 19th century. The preserved houses showcase Victorian, colonial, and Art Nouveau architecture with stunning views of Kobe's harbour. The streets are quieter and more European-feeling than anywhere else in Japan. Kobe also appears as a transit city in Makoto Shinkai's Suzume."
              hours: "Most houses 09:00–18:00"
              time_needed: "1.5–2 hours"
              station: "Shin-Kobe or Sannomiya Station (JR Kobe line from Osaka, ~30 min) — 15 min uphill walk"
              maps_query: "Kitano+Ijinkan+Kobe"
              tips: "The Weathercock House and Former Chinese Consulate are the highlights. Walk uphill for harbour panoramas."
          - tag: "food"
            tag_text: "Dinner"
            name: "Kobe Beef Teppanyaki"
            desc: "authentic Kobe beef dinner in Kitano or Sannomiya area. Budget ¥3,000–5,000 for a proper lunch/early set. 🥩"
            image: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Kobe is the birthplace of Japan's most famous beef — intensely marbled, melt-in-your-mouth wagyu from Tajima cattle raised in Hyogo Prefecture. A teppanyaki set gives you the full show: the chef sears the steak on an iron plate in front of you, finishing with garlic chips and seasonal vegetables."
              hours: "Lunch sets from 11:30, dinner from 17:00"
              time_needed: "1.5 hours"
              station: "Sannomiya Station — 5 min walk to restaurant area"
              maps_query: "Kobe+beef+teppanyaki+Sannomiya"
              tips: "Lunch/early sets are significantly cheaper than dinner. Look for restaurants with the official Kobe beef certificate displayed. Back to Osaka for the last night; pack for Kyoto tomorrow."

  - name: "Kyoto"
    jp: "京都"
    flag: "⛩️"
    lat: 35.0116
    lng: 135.7681
    dates: "Oct 16 – 19"
    nights: "4 nights"
    image: "https://images.unsplash.com/photo-1758470476240-dcbd04d3f799?w=1200&h=600&fit=crop&q=80"
    days:
      - num: "DAY 6"
        date: "Oct 16"
        title: "Move to Kyoto — Ease In"
        places:
          - tag: "main"
            tag_text: "Transit"
            name: "Osaka → Kyoto"
            desc: "~15 min by shinkansen (Shin-Osaka → Kyoto) or ~45 min local. Drop bags, then explore on foot. 🚆"
            image: "https://images.unsplash.com/photo-1554995207-c18c203602cb?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A short, easy hop from Osaka. The JR special rapid from Osaka Station reaches Kyoto in ~28 minutes (¥580); the shinkansen from Shin-Osaka takes ~15 minutes. With four nights in Kyoto, today is a gentle arrival day — settle into the hostel and ease into the city's rhythm."
              hours: "Trains run frequently all day"
              time_needed: "30–45 minutes"
              station: "Kyoto Station (京都駅)"
              maps_query: "Kyoto+Station"
              tips: "Pick a central hostel near Sanjo/Karasuma or Kyoto Station. Stash your bag and head out light."
          - tag: "food"
            tag_text: "Afternoon"
            name: "Nishiki Market"
            desc: "'Kyoto's Kitchen' — a 400m covered lane of pickles, tofu, yuba, sweets and skewers. 🥢"
            image: "https://images.unsplash.com/photo-1552611052-33e04de16ea3?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A narrow five-block covered market that has fed Kyoto for over 400 years. Around 130 stalls sell Kyoto specialities — tsukemono pickles, fresh yuba and tofu, dashi, knives, and seasonal sweets. A great grazing lunch and an introduction to Kyoto's refined food culture."
              hours: "Most stalls 10:00–18:00"
              time_needed: "1 hour"
              station: "Shijo Station / Karasuma — 3 min walk"
              maps_query: "Nishiki+Market+Kyoto"
              tips: "Eat as you walk, but step to the side — eating while walking is frowned upon. Try fresh soy-milk doughnuts and tako-tamago."
          - tag: "quiet"
            tag_text: "Dusk"
            name: "Pontocho & Gion Shinbashi-dori"
            desc: "narrow riverside dining lane + the lantern-lit Shirakawa canal lane in Gion at dusk. 🏮"
            image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Two of Kyoto's most atmospheric lanes. Pontocho is a single narrow alley alongside the Kamo River, lined with traditional restaurants and izakaya. A few minutes east, Shinbashi-dori runs beside the Shirakawa canal in Gion — stone-paved, willow-lined, lit by paper lanterns, and less photographed than Hanamikoji."
              hours: "Best at dusk (17:00–19:00); restaurants 17:00–23:00"
              time_needed: "1.5–2 hours"
              station: "Sanjo / Gion-Shijo Station — 5 min walk"
              maps_query: "Pontocho+Alley+Kyoto"
              tips: "Walk Pontocho first to scan options, then drift to Shinbashi-dori as the lanterns come on. You may spot a geiko heading to an engagement."

      - num: "DAY 7"
        date: "Oct 17"
        title: "Kurama & Kibune — Secret Mountain Villages"
        places:
          - tag: "quiet"
            tag_text: "Very Quiet"
            name: "Kurama → Kibune trail"
            desc: "Eizan Railway to Kurama (~40 min, ¥470). Hike through ancient cedar forest past Kurama-dera Temple, then descend into Kibune village. 🌲"
            image: "https://images.unsplash.com/photo-1527974361724-67fd5ebfd6d2?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A stunning mountain trail connecting two ancient villages north of Kyoto. Start at Kurama village, visit Kurama-dera Temple (founded 770 AD), then hike through towering cedar forest over the mountain pass and descend into the enchanting Kibune village. Soak at Kurama Onsen first if you start early."
              hours: "Trail: dawn to dusk. Eizan Railway: 05:45–23:30"
              time_needed: "4–5 hours (including lunch)"
              station: "Kurama Station (鞍馬駅) — Eizan Railway from Demachiyanagi"
              maps_query: "Kurama+to+Kibune+trail+Kyoto"
              tips: "Start from the Kurama side (uphill is easier this direction). Wear proper shoes — the trail is rocky."
              activity:
                booking: "Kawadoko riverside lunch (Hirobun / Kifune Kyubei) — reserve 2–3 days ahead"
                cost: "¥3,000–5,000+ per person (kawadoko lunch set)"
                duration: "4–5 hours total"
                what_to_bring: "Hiking shoes, water, rain jacket, towel (for onsen)"
          - tag: "main"
            tag_text: "Note"
            name: "Kawadoko season check ⚠️"
            desc: "the over-water dining platforms in Kibune typically close mid-October. If they're down, the hike + a regular Kibune restaurant are still excellent."
            image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Kibune's famous kawadoko (川床) — dining platforms built directly over the rushing Kibune River — run through the warm season and usually come down by mid-October. Oct 17 is borderline, so confirm directly with Hirobun (075-741-2147) when you book. Even without the platforms, the cedar-forest hike and Kifune Shrine make this one of the best days in Kyoto."
              hours: "Kawadoko season roughly May–mid-October"
              time_needed: "—"
              station: "Kibune-guchi Station → village shuttle/walk"
              maps_query: "Hirobun+Kibune+Kyoto"
              tips: "Book by phone or Tabelog 2–3 days ahead. If kawadoko has ended, ask for an indoor riverside table instead."

      - num: "DAY 8"
        date: "Oct 18"
        title: "West Kyoto — Arashiyama & Golden Temples"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Arashiyama Bamboo Grove + Tenryu-ji"
            desc: "🎋 towering grove of moso bamboo + Tenryu-ji's zen garden. Arrive early to beat the crowds."
            image: "https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A towering grove of moso bamboo that creates an otherworldly green tunnel, stretching about 500m from Tenryu-ji's north gate. Tenryu-ji itself (UNESCO) has one of Japan's finest zen gardens, designed to borrow the Arashiyama mountains as backdrop."
              hours: "Grove 24/7. Tenryu-ji 08:30–17:00 (¥500)"
              time_needed: "2 hours"
              station: "Saga-Arashiyama Station (嵯峨嵐山駅) — 10 min walk"
              maps_query: "Arashiyama+Bamboo+Grove+Kyoto"
              tips: "Arrive by 8am — the grove is magical and nearly empty before the tour buses. Enter the bamboo path from Tenryu-ji's north gate."
          - tag: "quiet"
            tag_text: "Hidden"
            name: "Jojakko-ji Temple"
            desc: "moss-covered steps through maple trees, 5 min from the bamboo grove. October colours are extraordinary and almost nobody visits. 🍁"
            image: "https://images.unsplash.com/photo-1527974361724-67fd5ebfd6d2?w=600&h=400&fit=crop&q=80&crop=bottom"
            extended:
              full_desc: "A small Nichiren Buddhist temple on a wooded hillside in Arashiyama. Moss-covered stone steps wind upward through ancient Japanese maple trees to a pagoda with panoramic views over Kyoto. In October the maples begin to turn — a fraction of the crowds of nearby sites."
              hours: "09:00–17:00 (¥500)"
              time_needed: "45 minutes"
              station: "5 min walk north of the bamboo grove, past Nonomiya Shrine"
              maps_query: "Jojakko-ji+Kyoto"
              tips: "Go right after the bamboo grove while you're in the area. The climb is short but the views and autumn maples are worth it."
          - tag: "main"
            tag_text: "Afternoon"
            name: "Kinkaku-ji + Ryoan-ji"
            desc: "Golden Pavilion (¥500) reflected in its mirror pond + Japan's most famous rock garden. ✨"
            image: "https://images.unsplash.com/photo-1490806843957-31f4c9a91c65?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "The legendary Golden Pavilion — a three-story Zen temple covered in gold leaf, reflected perfectly in its surrounding mirror pond. Nearby Ryoan-ji features Japan's most famous rock garden — 15 stones in raked white gravel, designed so you can never see all 15 from any single angle."
              hours: "09:00–17:00"
              time_needed: "2 hours (both temples)"
              station: "Bus from Arashiyama, or Bus 205 from Kyoto Station to Kinkaku-ji-michi"
              maps_query: "Kinkaku-ji+Kyoto"
              tips: "Kinkaku-ji and Ryoan-ji are a 15-minute walk apart — do them together. Late afternoon light makes the gold glow."

      - num: "DAY 9"
        date: "Oct 19"
        title: "East Kyoto — Inari Gates & Higashiyama"
        places:
          - tag: "main"
            tag_text: "Early AM"
            name: "Fushimi Inari Taisha"
            desc: "thousands of vermillion torii gates up Mount Inari. Go before 7am — the upper trails are blissfully silent. Free, 24/7. ⛩️"
            image: "https://images.unsplash.com/photo-1478436127897-769e1b3f0f36?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Kyoto's most iconic shrine — thousands of vermillion torii gates snake up the forested slopes of Mount Inari. Most tourists stop at the first viewpoint, but continuing toward the summit reveals increasingly atmospheric trails through ancient cedar forest."
              hours: "24/7, free admission"
              time_needed: "2–3 hours (full summit hike)"
              station: "Inari Station (稲荷駅) — JR Nara Line, 5 min from Kyoto Station"
              maps_query: "Fushimi+Inari+Taisha+Kyoto"
              tips: "Go before 7am for the best experience. The upper trails beyond Yotsutsuji are nearly empty even at peak times."
          - tag: "main"
            tag_text: "Midday"
            name: "Kiyomizu-dera + Higashiyama lanes"
            desc: "hillside temple with a vast wooden veranda over the valley, then wander the stone-paved Sannenzaka & Ninenzaka slopes. 🏯"
            image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Kiyomizu-dera (UNESCO) is built on a hillside with a huge wooden stage jutting over the valley — no nails used in its construction. Below it, the preserved lanes of Sannenzaka and Ninenzaka wind down through Higashiyama, lined with machiya shops, teahouses, and sweet stalls — among the most beautiful streets in Japan."
              hours: "06:00–18:00 (¥400)"
              time_needed: "2.5–3 hours"
              station: "Kiyomizu-michi or Gojo-zaka bus stop; Kiyomizu-Gojo Station (15 min walk)"
              maps_query: "Kiyomizu-dera+Kyoto"
              tips: "Combine the temple with a slow walk down Sannenzaka. Mid-morning is busy — but it thins by late afternoon."
          - tag: "quiet"
            tag_text: "Evening"
            name: "Gion & Yasaka Shrine"
            desc: "lantern-lit Gion streets at dusk, ending at the vermilion Yasaka Shrine. A last unhurried Kyoto evening. 🏮"
            image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Kyoto's famous geisha district at its best hour. Walk Hanamikoji and the quieter Shinbashi-dori as the paper lanterns come on, finishing at Yasaka Shrine — its main gate glowing with hundreds of lanterns at night. A fitting close to four days in Kyoto before the morning move to Hiroshima."
              hours: "Yasaka Shrine grounds 24/7"
              time_needed: "1.5–2 hours"
              station: "Gion-Shijo Station (祇園四条駅) — 5 min walk"
              maps_query: "Yasaka+Shrine+Kyoto"
              tips: "Be respectful in Gion — photography of geiko in the private lanes is prohibited. Pack tonight; the Hiroshima shinkansen leaves in the morning."

  - name: "Hiroshima & Miyajima"
    jp: "広島・宮島"
    flag: "☮️"
    lat: 34.3853
    lng: 132.4553
    dates: "Oct 20 – 21"
    nights: "1 night (on Miyajima)"
    image: "https://images.unsplash.com/photo-1768946579156-e29e7397b0bc?w=1200&h=600&fit=crop&q=80"
    days:
      - num: "DAY 10"
        date: "Oct 20"
        title: "Hiroshima Peace + Miyajima Island"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Peace Memorial Museum"
            desc: "Shinkansen Kyoto → Hiroshima (~1h40). (¥200) — deeply powerful, allow 2.5–3 hrs. Peace Park & Atomic Bomb Dome. ☮️"
            image: "https://images.unsplash.com/photo-1526481280693-3bfa7568e0f8?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "One of the most powerful museums in the world, documenting the atomic bombing of Hiroshima on August 6, 1945. The renovated East Building presents personal stories with devastating clarity. The surrounding Peace Memorial Park and the skeletal A-Bomb Dome stand as a monument to the victims and a plea for peace."
              hours: "08:30–18:00"
              time_needed: "2.5–3 hours"
              station: "Hiroshima Station (広島駅) — tram to Genbaku Dome-mae, 20 min"
              maps_query: "Hiroshima+Peace+Memorial+Museum"
              tips: "Go first thing after the morning shinkansen to avoid afternoon crowds. The museum is emotionally intense — pace yourself. Store your bag in a station locker."
          - tag: "quiet"
            tag_text: "Quiet"
            name: "Shukkei-en Garden"
            desc: "400-year-old miniature landscape garden. Serene, almost always uncrowded. Perfect counterpoint to the Peace Museum. ¥260 🌊"
            image: "https://images.unsplash.com/photo-1768946579156-e29e7397b0bc?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A 400-year-old 'condensed scenery' garden that miniaturises Chinese landscape paintings. Destroyed by the atomic bomb and meticulously restored — a symbol of renewal. A serene, almost always uncrowded counterpoint to the intensity of the Peace Museum."
              hours: "09:00–17:00 (Oct–Mar)"
              time_needed: "1 hour"
              station: "Shukkeien-mae tram stop — 1 min walk"
              maps_query: "Shukkei-en+Garden+Hiroshima"
              tips: "Tea house overlooking the pond (¥500). Almost never crowded. Optional — skip if you'd rather reach Miyajima earlier."
          - tag: "main"
            tag_text: "Afternoon"
            name: "Ferry to Miyajima"
            desc: "tram/JR to Miyajimaguchi → JR ferry (~10 min) to the island. Check in to your island stay. ⛴️"
            image: "https://images.unsplash.com/photo-1556388158-158ea5ccacbd?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Miyajima (officially Itsukushima) is a sacred island in Hiroshima Bay famous for its 'floating' torii gate. The JR ferry from Miyajimaguchi takes about 10 minutes and offers the classic approach view of the torii. Staying overnight on the island is the secret — once the day-trippers leave around 17:00, the streets and shrine become serene and the wild deer wander freely."
              hours: "JR ferry runs frequently; last boat back to the mainland ~22:14"
              time_needed: "45 min total transfer"
              station: "Miyajimaguchi → Miyajima pier (JR ferry, ¥180)"
              maps_query: "Miyajima+ferry+terminal"
              tips: "Covered by the Kansai-Hiroshima Area Pass if you bought one. Note a ¥100 Miyajima visitor tax on arrival."
          - tag: "food"
            tag_text: "Evening"
            name: "Island evening — torii at night + oysters"
            desc: "the illuminated torii after dark, quiet streets, grilled Hiroshima oysters and momiji-manju. 🦪"
            image: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "With the day-trippers gone, walk the waterfront to see the Itsukushima torii illuminated against the dark bay — one of the most beautiful night scenes in Japan. Dinner is fresh grilled oysters (Hiroshima produces 60% of Japan's oysters, and October starts peak season) and warm momiji-manju, the island's maple-leaf-shaped cakes."
              hours: "Torii illuminated until ~23:00"
              time_needed: "2 hours"
              station: "Miyajima waterfront — walk from your stay"
              maps_query: "Itsukushima+Shrine+Miyajima"
              tips: "Check the tide table — high tide makes the torii 'float'; low tide lets you walk out to it. Both are worth seeing."

      - num: "DAY 11"
        date: "Oct 21"
        title: "Miyajima Dawn → Shinkansen to Tokyo"
        places:
          - tag: "quiet"
            tag_text: "Very Quiet"
            name: "Dawn at the Floating Torii"
            desc: "the torii and Itsukushima Shrine at sunrise, with the island almost to yourself before the first ferries. 🌅⛩️"
            image: "https://images.unsplash.com/photo-1768946579156-e29e7397b0bc?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "The reason to sleep on the island. At dawn the Itsukushima Shrine — a complex of vermilion halls built on stilts over the water (UNESCO World Heritage) — and its iconic offshore torii are bathed in soft morning light, with only a handful of people and the resident deer for company. The shrine opens early; the torii reflects in the wet sand at low tide."
              hours: "Itsukushima Shrine 06:30–18:00 (¥300)"
              time_needed: "1.5–2 hours"
              station: "Walk from your island stay"
              maps_query: "Itsukushima+Shrine+Miyajima"
              tips: "Be at the shrine for opening. Optional: the Mt Misen ropeway (¥2,000) for bay views and wild monkeys if you have time before the train."
          - tag: "main"
            tag_text: "Afternoon"
            name: "Shinkansen Hiroshima → Tokyo"
            desc: "ferry back, then Nozomi to Tokyo (~4 hrs). Mt Fuji appears on the right (seat E) ~40 min before arrival. 🗻🚄"
            image: "https://images.unsplash.com/photo-1554995207-c18c203602cb?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Return by ferry to Miyajimaguchi and take the shinkansen from Hiroshima all the way to Tokyo (~4 hours via Shin-Osaka on the Nozomi). Buy this single ticket online via smartEX (~¥19,440 reserved). On a clear afternoon, Mt Fuji is visible on the right-hand side (seat E) between Shizuoka and Shin-Fuji, roughly 40 minutes before Tokyo."
              hours: "Frequent departures; ~4h journey"
              time_needed: "Half day with transfers"
              station: "Hiroshima Station → Tokyo Station"
              maps_query: "Hiroshima+Station"
              tips: "Reserve a window seat E (right side, eastbound) for the Fuji view. Grab an ekiben bento at Hiroshima Station for the ride."

  - name: "Tokyo"
    jp: "東京"
    flag: "🗼"
    lat: 35.6762
    lng: 139.6503
    dates: "Oct 21 – 24"
    nights: "3 nights (last near Narita)"
    image: "https://images.unsplash.com/photo-1764418658791-771bb04efdcd?w=1200&h=600&fit=crop&q=80"
    days:
      - num: "DAY 12"
        date: "Oct 22"
        title: "Old Tokyo & Anime Pilgrimage"
        places:
          - tag: "main"
            tag_text: "Morning"
            name: "Senso-ji Temple"
            desc: "Tokyo's oldest Buddhist temple. Arrive before 7am for mist and silence. Nakamise-dori shopping street. 🏯"
            image: "https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Tokyo's oldest and most visited Buddhist temple, founded in 628 AD. The massive Kaminarimon gate leads to Nakamise-dori — a 250m shopping street of traditional snacks and crafts."
              hours: "Temple grounds: 24/7. Main hall: 06:00–17:00"
              time_needed: "1.5–2 hours"
              station: "Asakusa Station (浅草駅) — 1 min walk"
              maps_query: "Senso-ji+Temple+Asakusa+Tokyo"
              tips: "Arrive before 7am for the misty, tourist-free experience. Try freshly made ningyo-yaki and thunder crackers."
          - tag: "quiet"
            tag_text: "Very Quiet"
            name: "Yanaka Ginza"
            desc: "Tokyo's most nostalgic old shopping street. Tofu shops, sembei crackers, cats on rooftops. Almost no tourists. 🐱"
            image: "https://images.unsplash.com/photo-1565707990801-71e6d5f10ac6?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A lovingly preserved old-school Tokyo shopping street that survived war and modernisation. Small family-run shops, cats as unofficial mascots, and the famous Yuyake Dandan sunset stairs."
              hours: "Most shops 10:00–18:00"
              time_needed: "1.5–2 hours"
              station: "Nippori Station (日暮里駅) — 5 min walk downhill"
              maps_query: "Yanaka+Ginza+Tokyo"
              tips: "Enter from the Nippori side for the famous 'Yuyake Dandan' sunset stairs. Try the ¥70 menchi-katsu at the top."
          - tag: "quiet"
            tag_text: "Anime"
            name: "Makoto Shinkai Pilgrimage 🎬"
            desc: "a free half-day route through real anime locations: Suga Shrine steps (Your Name), Hijiribashi/Ochanomizu (Suzume), Shinjuku footbridge (Weathering With You)."
            image: "https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "A self-guided walk through the real-life backdrops of Makoto Shinkai's films, all free public places. Suga Shrine steps in Yotsuya (the closing reunion in 'Your Name'); Hijiribashi bridge and Ochanomizu Station ('Suzume' — best 7:30–9am for the three-train shot); and around Shinjuku, the New Metropolitan footbridge and Busta Shinjuku ('Weathering With You'). Asahi Inari Shrine in Ginza appears in both Your Name and Weathering With You."
              hours: "All outdoor/public — anytime"
              time_needed: "~4 hours for the core route"
              station: "Yotsuya-Sanchome → Ochanomizu → Shinjuku"
              maps_query: "Suga+Shrine+Yotsuya+Tokyo"
              tips: "Suga Shrine steps are emptiest before 8am; by 10am fans queue for photos. Bring the RADWIMPS soundtrack."
          - tag: "main"
            tag_text: "Sunset"
            name: "Shibuya + Shibuya Sky"
            desc: "Scramble Crossing + the open-air Shibuya Sky observation deck at sunset (book a timed slot — they sell out). 🌆"
            image: "https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "The world's busiest pedestrian crossing — up to 3,000 people cross at once. Shibuya Sky offers a 229m open-air rooftop deck with a 360° view; the sunset slot over the Tokyo skyline (with Fuji on clear days) is the highlight."
              hours: "Shibuya Sky: 10:00–22:30 (last entry 21:20)"
              time_needed: "2–3 hours"
              station: "Shibuya Station (渋谷駅)"
              maps_query: "Shibuya+Scramble+Crossing+Tokyo"
              tips: "Book Shibuya Sky online in advance — sunset slots (~¥3,400) sell out. Nonbei Yokocho nearby has tiny atmospheric bars."

      - num: "DAY 13"
        date: "Oct 23"
        title: "Modern Tokyo / Optional Fuji → Move to Narita"
        places:
          - tag: "food"
            tag_text: "Breakfast"
            name: "Tsukiji Outer Market"
            desc: "sushi breakfast at 7am 🍣. The outer market remains vibrant and authentic."
            image: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "The outer market surrounding the former Tsukiji fish market — hundreds of small shops serve the freshest sushi, tamago, and seafood. The energy is best early."
              hours: "05:00–14:00 (best before 10am)"
              time_needed: "1–1.5 hours"
              station: "Tsukiji Station (築地駅) — 1 min walk"
              maps_query: "Tsukiji+Outer+Market+Tokyo"
              tips: "Go before 8am for best selection. Try smaller shops like Tsukiji Sushi-Sei. Budget ¥2,000–4,000."
          - tag: "main"
            tag_text: "Choose one"
            name: "Shimokitazawa  —or—  Mt Fuji day trip"
            desc: "either indie/vintage Shimokitazawa (Hamarikyu Gardens + Koenji nearby), OR the Fuji Excursion ltd express to Kawaguchiko for lake + Fuji views. 🎶 / 🗻"
            image: "https://images.unsplash.com/photo-1764418658791-771bb04efdcd?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Option A (city): Shimokitazawa is Tokyo's beloved indie neighbourhood — vintage clothing, vinyl, independent coffee, no chain stores. Pair with Hamarikyu Gardens (a 300-year-old shogunate garden ringed by skyscrapers) or indie Koenji. Option B (Fuji): take the direct Fuji Excursion limited express from Shinjuku to Kawaguchiko (~1h55, ~¥4,200) for lake views with Mt Fuji behind — best on a clear morning."
              hours: "Shops 12:00–20:00 / Fuji Excursion runs daily"
              time_needed: "Half to full day"
              station: "Shimokitazawa Station (Keio Inokashira) / Shinjuku → Kawaguchiko"
              maps_query: "Shimokitazawa+Tokyo"
              tips: "If chasing Fuji, check the forecast the night before — go only if skies are clear. Either way, head back in good time to move to Narita this evening."
          - tag: "main"
            tag_text: "Night"
            name: "Move to Narita"
            desc: "transfer to Narita and sleep at the airport — the 05:45 flight means being at check-in ~03:45, before trains run. 🛏️"
            image: "https://images.unsplash.com/photo-1556388158-158ea5ccacbd?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Because the departure is at 05:45, the smart move is to sleep at the airport rather than risk pre-dawn transport. The '9h nine hours' capsule hotel is inside Terminal 2 (connected walkway) — walk to check-in in 5 minutes. Hotel shuttles don't run early enough to make a 03:45 cutoff, so a 'shuttle hotel' would force a 03:30 taxi anyway."
              hours: "Keisei Skyliner / NEX from central Tokyo ~60 min"
              time_needed: "Evening transfer"
              station: "Narita Airport (成田空港) Terminal 2"
              maps_query: "Narita+Airport+Terminal+2"
              tips: "Book 9h nine hours Narita early — it fills up. Confirm overnight check-in covers your evening arrival."

      - num: "DAY 14"
        date: "Oct 24"
        title: "Departure Day"
        places:
          - tag: "main"
            tag_text: "05:45 IST"
            name: "Departure Flight 1"
            desc: "✈ XJ 601 departs Tokyo NRT → Bangkok DMK (arrives 13:10 IST)"
            image: "https://images.unsplash.com/photo-1556388158-158ea5ccacbd?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Thai AirAsia X flight XJ 601 from Narita to Bangkok Don Mueang. Approximately 6.5 hours."
              hours: "Departs 05:45 (be at check-in by ~03:45)"
              time_needed: "8 hours total"
              station: "Narita Airport (成田空港)"
              maps_query: "Narita+Airport+Tokyo"
              tips: "Sleeping at the in-terminal capsule the night before makes this early departure painless."
          - tag: "main"
            tag_text: "18:50 IST"
            name: "Departure Flight 2"
            desc: "✈ FD 170 departs Bangkok DMK → Kochi COK (arrives 22:30 IST). Home. 🏠"
            image: "https://images.unsplash.com/photo-1556388158-158ea5ccacbd?w=600&h=400&fit=crop&q=80"
            extended:
              full_desc: "Thai AirAsia flight FD 170 from Bangkok Don Mueang to Cochin International Airport. Approximately 3.5 hours."
              hours: "Departs 18:50 IST (arrives 22:30 IST)"
              time_needed: "5 hours (layover + flight)"
              station: "Don Mueang Airport (DMK)"
              maps_query: "Don+Mueang+Airport+Bangkok"
              tips: "DMK has decent food courts on the 3rd floor. Magic Food Point outside arrivals has cheap Thai food if the layover is long."
