gems:
  - city: "Osaka"
    name: "Hozenji Yokocho"
    lat: 34.6686
    lng: 135.5023
    description: "Lantern-lit mossy alley beside a tiny moss-draped temple. 50 metres from Dotonbori chaos, feels like a different century."
    crowd_level: 1
    crowd_label: "Very Low"
    image: "https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "A narrow, stone-paved alley centered around Hozenji Temple with its famous moss-covered Fudo Myo-o statue. Visitors splash water on the statue for good luck, and centuries of this practice have given it a thick, sacred moss coating. Despite being just 50 metres from Dotonbori, the atmosphere is completely different — quiet, romantic, and timeless."
      best_time: "After dark (19:00–22:00) when lanterns are lit"
      how_to_get: "From Dotonbori, walk south past the Hozenji bridge. The alley is on your left."
      nearby: "Dotonbori (50m), Shinsaibashi Shopping Street (5 min walk)"
      crowd_tips: "Always quiet compared to Dotonbori. Weekday evenings are the most atmospheric."

  - city: "Osaka"
    name: "Nakazaki-cho"
    lat: 34.7080
    lng: 135.5080
    description: "Osaka's bohemian quarter — vintage coffee shops, old wooden machiya townhouses. Almost entirely unknown to foreign tourists."
    crowd_level: 1
    crowd_label: "Very Low"
    image: "https://images.unsplash.com/photo-1770284212085-20ef07376ffa?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "A retro neighbourhood of pre-war wooden machiya townhouses converted into indie coffee shops, vintage clothing stores, art galleries, and tiny bars. Osaka's answer to Shimokitazawa — deeply local, creative, and almost completely undiscovered by foreign tourists."
      best_time: "Weekday afternoons (13:00–17:00). Most cafes open from 11:00"
      how_to_get: "Direct exit from Nakazakicho Station (Tanimachi Line). Or 10 min walk north from Umeda."
      nearby: "Umeda Sky Building (15 min walk), Tenjinbashisuji Shopping Street (10 min)"
      crowd_tips: "Virtually no foreign tourists. Weekend afternoons see some local visitors but it never feels crowded."

  - city: "Koyasan"
    name: "Okunoin Cemetery"
    lat: 34.2158
    lng: 135.5920
    description: "2km lantern-lit path through 600-year-old cedar trees past 200,000 tombstones. One of the most atmospheric places in Japan."
    crowd_level: 2
    crowd_label: "Low"
    image: "https://images.unsplash.com/photo-1601823984263-b87b59798b70?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "Japan's largest cemetery and one of its most sacred sites — a 2km path through towering ancient cedar trees, past 200,000 tombstones and memorial pagodas spanning over 1,000 years. At dusk, stone lanterns are lit along the path. At the end, the Torodo Hall of Lamps houses 10,000 eternally burning lanterns."
      best_time: "Dusk (17:00–18:30) for the lantern-lit experience. Also atmospheric at dawn."
      how_to_get: "Okunoin-mae bus stop from Koyasan town centre. Or 30 min walk from main street."
      nearby: "Kongobu-ji Temple (10 min), Danjo Garan (15 min)"
      crowd_tips: "Very few tourists at dusk. The path is long enough that even midday visitors spread out. Walk slowly and respectfully."

  - city: "Koyasan"
    name: "Shukubo Temple Stay"
    lat: 34.2130
    lng: 135.5850
    description: "Overnight in a Buddhist monastery — tatami rooms, vegetarian shojin ryori cuisine, morning prayer ceremony at 6am."
    crowd_level: 1
    crowd_label: "Very Low"
    image: "https://images.unsplash.com/photo-1580537659466-0a9bfa916a54?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "A shukubo is a temple lodging experience unique to Koyasan. Sleep in a traditional tatami room with futon bedding, eat exquisite vegetarian shojin ryori cuisine, and attend the morning prayer ceremony at 6am with monks chanting in a candlelit hall."
      best_time: "The morning prayer at 6am is the highlight. Book for midweek for quieter experience."
      how_to_get: "Book at shukubo.net or directly at Eko-in, Fukuchi-in, or other temples. Arrive by 17:00."
      nearby: "Okunoin Cemetery (10 min bus), Danjo Garan pagodas (5 min walk)"
      crowd_tips: "Temple stays are inherently intimate — typically 10–20 guests per temple. The experience is deeply personal and quiet."

  - city: "Nara"
    name: "Isuien Garden"
    lat: 34.6889
    lng: 135.8419
    description: "A two-section strolling garden that uses 'borrowed scenery' to frame Todai-ji's great roof. Most visitors to Nara walk right past."
    crowd_level: 2
    crowd_label: "Low"
    image: "https://images.unsplash.com/photo-1748525591561-f19fdfe637b5?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "An exquisite Meiji-era strolling garden using the 'shakkei' (borrowed scenery) technique to frame Todai-ji's massive roof and the surrounding hills. The front garden has ponds and stepping stones; the rear garden has a waterfall and tea house."
      best_time: "Mid-morning (10:00–12:00) for best light. Spring and autumn are most colourful."
      how_to_get: "Between Todai-ji and central Nara — look for the entrance on the main path. Easy to miss."
      nearby: "Todai-ji (5 min walk), Kasuga Taisha (15 min walk)"
      crowd_tips: "Almost always uncrowded. Tea house matcha (¥500 extra) with a view of Todai-ji's roof. Closed Tuesdays. ¥1,200."

  - city: "Kobe"
    name: "Kitano Ijinkan"
    lat: 34.7010
    lng: 135.1920
    description: "Western-style foreign residences on a hillside with sea views. Quiet, European-feeling streets — unlike anywhere else in Japan."
    crowd_level: 2
    crowd_label: "Low"
    image: "https://images.unsplash.com/photo-1592806088932-05058af0ad8d?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "A hillside neighbourhood of ornate Western-style residences built by foreign traders in the late 19th century — Victorian, colonial, and Art Nouveau architecture with stunning harbour views. The streets feel more European than Japanese, with cafes, boutiques, and panoramic viewpoints."
      best_time: "Afternoon (13:00–17:00) for best light on the sea views. Weekdays are quietest."
      how_to_get: "Shin-Kobe Station or Sannomiya Station — 15 min uphill walk through the neighbourhood."
      nearby: "Kobe Harborland (20 min walk), Meriken Park (15 min), Sannomiya restaurant district"
      crowd_tips: "Weekday afternoons are very quiet. The Weathercock House and Former Chinese Consulate are the highlights. Free to walk the streets; individual houses ¥300–500."

  - city: "Kyoto"
    name: "Kurama & Kibune"
    lat: 35.1180
    lng: 135.7700
    description: "Two mountain villages linked by a cedar forest hike. Riverside kawadoko lunch above the stream. Almost no foreign tourists."
    crowd_level: 2
    crowd_label: "Low"
    image: "https://images.unsplash.com/photo-1527974361724-67fd5ebfd6d2?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "Two ancient mountain villages 30 minutes north of Kyoto, connected by a stunning hiking trail through towering cedar forest. Kurama has a 1,200-year-old temple and an excellent onsen. Kibune is famous for riverside kawadoko restaurants."
      best_time: "October for autumn colours. May–September for kawadoko dining. Weekdays are quietest."
      how_to_get: "Eizan Railway from Demachiyanagi Station to Kurama (30 min, ¥420). Hike over the mountain to Kibune, then train back."
      nearby: "Kifune Shrine (in Kibune), Kurama Onsen (in Kurama)"
      crowd_tips: "Very few foreign tourists. The trail itself is never crowded. Book kawadoko restaurants in advance during peak season."

  - city: "Kyoto"
    name: "Jojakko-ji Temple"
    lat: 35.0220
    lng: 135.6710
    description: "5 min from the Arashiyama bamboo grove that virtually nobody visits. Moss-covered steps through maple trees. October colours are stunning."
    crowd_level: 1
    crowd_label: "Very Low"
    image: "https://images.unsplash.com/photo-1527974361724-67fd5ebfd6d2?w=800&h=500&fit=crop&q=80&crop=bottom"
    extended:
      full_desc: "A small Nichiren Buddhist temple on a wooded hillside in Arashiyama. Moss-covered stone steps wind upward through ancient Japanese maple trees to a pagoda with panoramic views. In October, the maples explode with colour."
      best_time: "Late October to mid-November for peak autumn colours. 09:00 opening is quietest."
      how_to_get: "From Arashiyama Bamboo Grove, walk north 5 minutes past Nonomiya Shrine."
      nearby: "Arashiyama Bamboo Grove (5 min), Okochi Sanso Villa (3 min)"
      crowd_tips: "Even during autumn, this temple sees a fraction of nearby sites' visitors. ¥500 admission."

  - city: "Kyoto"
    name: "Shinbashi-dori"
    lat: 35.0040
    lng: 135.7740
    description: "Stone-paved canal lane in Gion at dusk — paper lanterns, willow trees, machiya townhouses. More atmospheric than Hanamikoji."
    crowd_level: 2
    crowd_label: "Low"
    image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "A narrow stone-paved lane alongside the Shirakawa canal in Gion. Traditional wooden machiya with bamboo screens, warm paper lanterns at dusk casting golden light over willow trees and water."
      best_time: "Dusk (17:00–19:00) when lanterns are lit and light is golden."
      how_to_get: "Gion-Shijo Station — 5 min walk east along Shijo-dori, then turn north."
      nearby: "Hanamikoji-dori (5 min), Yasaka Shrine (5 min), Pontocho Alley (10 min)"
      crowd_tips: "Less photographed than Hanamikoji but more atmospheric. Walk slowly — you may spot a geiko heading to an evening engagement."

  - city: "Hiroshima"
    name: "Shukkei-en Garden"
    lat: 34.3989
    lng: 132.4667
    description: "400-year-old miniature landscape garden in central Hiroshima. Serene, almost always uncrowded — a world away from the Peace Park."
    crowd_level: 1
    crowd_label: "Very Low"
    image: "https://images.unsplash.com/photo-1768946579156-e29e7397b0bc?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "Built in 1620, this 'condensed scenery' garden miniaturises Chinese landscape paintings. Destroyed by the atomic bomb, lovingly restored — a symbol of renewal."
      best_time: "Morning (09:00–11:00) for best light. Late October for autumn colours."
      how_to_get: "Shukkeien-mae tram stop — 1 minute walk."
      nearby: "Peace Memorial Museum (20 min walk), Hiroshima Castle (10 min walk)"
      crowd_tips: "Almost never crowded. Even on weekends you'll often have sections to yourself. ¥260 admission."

  - city: "Miyajima"
    name: "Miyajima at Dawn"
    lat: 34.2959
    lng: 132.3197
    description: "The floating Itsukushima torii and shrine at sunrise — once the day-trippers leave and before they return, the island is yours and the deer."
    crowd_level: 1
    crowd_label: "Very Low"
    image: "https://images.unsplash.com/photo-1768946579156-e29e7397b0bc?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "Itsukushima Shrine (UNESCO) is a complex of vermilion halls built on stilts over the sea, with its iconic offshore torii. The secret is to sleep on the island: after ~17:00 the crowds vanish, the torii is illuminated at night, and at dawn you can have the shrine almost to yourself in soft morning light."
      best_time: "Dawn (around shrine opening, 06:30). Also magical illuminated after dark."
      how_to_get: "JR ferry from Miyajimaguchi (~10 min). Stay overnight on the island."
      nearby: "Mt Misen ropeway (bay views, wild monkeys), Daisho-in Temple, Omotesando shopping street"
      crowd_tips: "Check the tide table — high tide makes the torii 'float'; low tide lets you walk out to it. ¥300 shrine entry + ¥100 visitor tax."

  - city: "Tokyo"
    name: "Yanaka Ginza"
    lat: 35.7275
    lng: 139.7678
    description: "Tokyo's most nostalgic old shopping street — tofu shops, sembei crackers, cats on rooftops. Almost no tourists."
    crowd_level: 2
    crowd_label: "Low"
    image: "https://images.unsplash.com/photo-1565707990801-71e6d5f10ac6?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "A lovingly preserved old-school Tokyo shopping street that survived war and modernisation. Small family-run shops, cat mascots, and the famous Yuyake Dandan sunset stairs."
      best_time: "Weekday mornings (10:00–12:00). Late afternoon for the sunset stairs."
      how_to_get: "Nippori Station (JR Yamanote Line) — 5 min walk downhill."
      nearby: "Ueno Park (20 min walk), Tokyo National Museum (15 min)"
      crowd_tips: "Almost no foreign tourists. Try the ¥70 menchi-katsu at the top of the stairs."

  - city: "Tokyo"
    name: "Shimokitazawa"
    lat: 35.6610
    lng: 139.6680
    description: "Tokyo's indie music and vintage fashion hub. No chain stores, no tourist traps — just record shops, coffee, and neighbourhood bars."
    crowd_level: 1
    crowd_label: "Very Low"
    image: "https://images.unsplash.com/photo-1764418658791-771bb04efdcd?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "Tokyo's most beloved indie neighbourhood — vintage clothing, vinyl records, independent coffee, small theatres, and live music. Zero chain stores, zero tourist infrastructure."
      best_time: "Afternoon to evening (14:00–21:00). Live music from 19:00."
      how_to_get: "Shimokitazawa Station — Keio Inokashira from Shibuya (3 min)."
      nearby: "Shibuya (3 min train), Sangenjaya (5 min train)"
      crowd_tips: "Virtually zero foreign tourists. Best vintage shops on the south side. Check live house schedules."

  - city: "Tokyo"
    name: "Koenji"
    lat: 35.7050
    lng: 139.6490
    description: "Tokyo's indie/bohemian district — antique shops, vinyl records, great izakayas. Zero tourist vibe, pure local energy."
    crowd_level: 1
    crowd_label: "Very Low"
    image: "https://images.unsplash.com/photo-1565707990801-71e6d5f10ac6?w=800&h=500&fit=crop&q=80"
    extended:
      full_desc: "A bohemian neighbourhood on the Chuo Line known for second-hand clothing, vinyl records, independent music venues, and friendly neighbourhood izakayas. Creative, slightly anarchic energy — street art and tiny live houses."
      best_time: "Evening (17:00–late) for izakayas and bars. Afternoon for shopping."
      how_to_get: "Koenji Station — JR Chuo Line from Shinjuku (10 min)."
      nearby: "Nakano Broadway (2 stops), Asagaya (1 stop)"
      crowd_tips: "No foreign tourists. Standing bars (tachinomi) north of the station have the cheapest drinks in Tokyo."
