cities:
  - name: "Osaka"
    items:
      - name: "Takoyaki at Kukuru 🐙"
        extended:
          description: "Crispy-outside, gooey-inside octopus balls — Osaka's most iconic street food. Kukuru uses whole octopus legs for a more generous filling than most competitors."
          where: "Kukuru, Dotonbori — look for the giant octopus sign"
          price: "¥500–700 for 8 pieces"
          dietary: "Contains wheat, egg, octopus. Not vegetarian."
      - name: "Okonomiyaki at Mizuno"
        extended:
          description: "Osaka-style savoury pancake — all ingredients mixed into the batter (unlike Hiroshima-style layering). Mizuno has been perfecting their recipe since 1945 with a yam-based batter that's impossibly fluffy."
          where: "Mizuno, Dotonbori — 1 min from Glico Man"
          price: "¥1,000–1,800"
          dietary: "Contains wheat, egg, pork. Seafood options available. Not vegetarian."
      - name: "Kushikatsu at Daruma"
        extended:
          description: "Deep-fried skewered meat, vegetables, and seafood dipped in a tangy Worcestershire-style sauce. Osaka's Shinsekai district invented this dish. The golden rule: never double-dip."
          where: "Daruma, Shinsekai — the shop with the angry chef statue"
          price: "¥100–200 per skewer. Full meal ¥1,500–2,500"
          dietary: "Meat and seafood options. Some vegetable skewers available. Contains wheat."
      - name: "Ramen at Kinryu"
        extended:
          description: "24-hour tonkotsu (pork bone broth) ramen joint with a giant dragon sign. Rich, porky, and cheap — the quintessential Osaka late-night fuel stop."
          where: "Kinryu Ramen, Dotonbori — under the golden dragon"
          price: "¥600–900"
          dietary: "Pork-based broth. Not halal. Not vegetarian."

  - name: "Kyoto"
    items:
      - name: "Kaiseki lunch set"
        extended:
          description: "Traditional Japanese haute cuisine — a multi-course meal of seasonal dishes presented as edible art. Lunch sets (bento-style) offer the kaiseki experience at a fraction of dinner prices."
          where: "Gion Nanba or Kikunoi (Michelin-starred). Budget option: Gion Kappa on Hanamikoji"
          price: "¥3,000–5,000 (lunch set). Dinner: ¥15,000+"
          dietary: "Usually contains fish, seafood, egg. Some courses may include meat. Advance notice needed for dietary restrictions."
      - name: "Yudofu tofu hot pot"
        extended:
          description: "Kyoto's signature vegetarian dish — silky soft tofu simmered in kombu (kelp) broth, served with dipping sauces. Simple, elegant, and deeply warming. A Zen Buddhist tradition."
          where: "Nanzenji Junsei (in Nanzen-ji temple grounds) or Tousuiro near Kiyomizu"
          price: "¥1,500–3,000"
          dietary: "Vegetarian. Vegan if you skip the bonito dipping sauce (request kombu-only). Gluten-free."
      - name: "Matcha parfait — Nakamura Tokichi 🍵"
        extended:
          description: "Layers of matcha ice cream, matcha jelly, matcha cake, azuki beans, and whipped cream — an elaborate green tea sundae from one of Kyoto's oldest tea merchants (est. 1854). The matcha is intensely flavoured and deeply bitter-sweet."
          where: "Nakamura Tokichi, Uji (30 min from Kyoto) or Kyoto Station branch"
          price: "¥1,200–1,500"
          dietary: "Contains dairy, egg, wheat. Not vegan."
      - name: "Pontocho riverside dinner"
        extended:
          description: "Dining along Kyoto's atmospheric Pontocho alley — a narrow lane of restaurants alongside the Kamo River. In warm months, restaurants extend wooden terraces (yuka) over the river for open-air dining."
          where: "Pontocho Alley, between Sanjo and Shijo bridges"
          price: "¥2,000–5,000 per person (izakaya). ¥8,000+ (kaiseki)"
          dietary: "Varies by restaurant. Most offer fish and meat. Some izakayas accommodate vegetarian requests."

  - name: "Hiroshima"
    items:
      - name: "Hiroshima okonomiyaki (Okonomi-mura)"
        extended:
          description: "Hiroshima-style okonomiyaki is layered, not mixed — thin batter, a mountain of cabbage, pork belly, yakisoba noodles, and egg, all assembled on a hot griddle before your eyes. Completely different from Osaka-style."
          where: "Okonomi-mura (6-floor building, 24 stalls). Upper floors less crowded."
          price: "¥800–1,200"
          dietary: "Contains wheat, egg, pork. Seafood substitution possible. Not vegetarian."
      - name: "Fresh grilled oysters 🦪"
        extended:
          description: "Hiroshima produces over 60% of Japan's oysters. October marks the start of peak season — the oysters are plump, sweet, and enormous. Grilled with butter, lemon, or ponzu."
          where: "Miyajima island stalls, or Ekiichi near Hiroshima Station"
          price: "¥200–400 per oyster. ¥1,000–2,000 for a plate"
          dietary: "Shellfish. Gluten-free."
      - name: "Tsukemen dipping ramen"
        extended:
          description: "Cold noodles served alongside a concentrated hot broth for dipping. Hiroshima's version uses thick, chewy noodles with a rich seafood-pork broth. Refreshing yet satisfying."
          where: "Bakudanya (multiple locations in Hiroshima)"
          price: "¥850–1,100"
          dietary: "Contains wheat, pork, seafood. Not vegetarian."

  - name: "Okinawa"
    items:
      - name: "Goya champuru (bitter melon stir fry)"
        extended:
          description: "Okinawa's signature dish — bitter melon (goya) stir-fried with tofu, egg, and pork belly. The bitterness is an acquired taste, but it's deeply nutritious and considered a key to Okinawan longevity."
          where: "Any local shokudo (diner). Try Makishi Public Market 2F restaurants."
          price: "¥600–900"
          dietary: "Contains egg, pork. Can be made vegetarian on request (some places)."
      - name: "Okinawa soba 🍜"
        extended:
          description: "Not buckwheat soba — Okinawa soba uses thick wheat noodles in a clear pork and bonito broth, topped with braised pork belly (soki) and pickled ginger. Comfort food of the highest order."
          where: "Kishimoto Shokudo in Nago (est. 1905) or Hamaya near Makishi Market"
          price: "¥550–800"
          dietary: "Contains wheat, pork. Not vegetarian. Not halal."
      - name: "Rafute braised pork belly"
        extended:
          description: "Okinawan-style braised pork belly — slow-cooked for hours in awamori (Okinawan rice spirit), soy sauce, and brown sugar until it melts on the tongue. Rich, sweet, and deeply savoury."
          where: "Yunangi in Naha (famous for home-style Okinawan cooking)"
          price: "¥800–1,200"
          dietary: "Pork. Not halal. Not vegetarian. Gluten-free."
      - name: "Awamori rice spirit 🍶"
        extended:
          description: "Okinawa's indigenous distilled spirit, made from Thai indica rice and black koji mould. Typically 30–43% ABV. Aged awamori (kusu) develops complex, mellow flavours similar to aged whisky. Usually served with water and ice."
          where: "Any izakaya or bar. Helios Pub (craft awamori cocktails) in Naha."
          price: "¥400–800 per glass"
          dietary: "Alcohol. Gluten-free. Vegan."
      - name: "Blue Seal ice cream 🍦"
        extended:
          description: "An Okinawan institution since 1948, originally created for American military bases. Unique flavours include beni-imo (purple sweet potato), shikuwasa (Okinawan citrus), sugar cane, and salt cookie."
          where: "Blue Seal shops across Naha, Chatan, and American Village"
          price: "¥300–500 (single/double)"
          dietary: "Contains dairy. Some flavours contain egg. Not vegan."
      - name: "Makishi Market seafood"
        extended:
          description: "Choose your own seafood from the colourful ground-floor stalls — tropical fish, giant prawns, sea grapes — then take it upstairs to a 2F restaurant that cooks it for you. A uniquely Okinawan eat-your-pick experience."
          where: "Makishi Public Market, Kokusai Street area, Naha"
          price: "¥2,000–3,000 (including cooking fee)"
          dietary: "Seafood. Cooking styles include sashimi, grilled, fried, or boiled."

  - name: "Tokyo"
    items:
      - name: "Tsukiji sushi breakfast 🍣"
        extended:
          description: "Ultra-fresh sushi for breakfast at the outer market surrounding the original Tsukiji fish market. The inner wholesale market moved to Toyosu, but the 400+ outer market shops remain — and the sushi is just as legendary."
          where: "Tsukiji Outer Market. Sushi Dai and Daiwa Sushi are famous (long queues). Try Tsukiji Sushi-Sei for no-wait quality."
          price: "¥2,000–4,000 (omakase breakfast set)"
          dietary: "Raw fish. Not vegetarian. Some shops offer tamago (egg) and vegetable options."
      - name: "Yakitori under Yurakucho tracks"
        extended:
          description: "Smoky, atmospheric yakitori (grilled chicken skewer) joints tucked under the JR railway tracks near Yurakucho Station. The trains rumble overhead as you drink beer and eat perfectly charcoal-grilled chicken parts — heart, skin, thigh, and tsukune (meatball)."
          where: "Yurakucho Station west side — under the railway arches"
          price: "¥150–300 per skewer. Full meal + drinks: ¥2,000–3,000"
          dietary: "Chicken, some pork. Not vegetarian. Not halal."
      - name: "Ichiran solo ramen booth"
        extended:
          description: "A unique tonkotsu ramen experience where you eat in individual curtained booths, customising every aspect of your bowl via a paper form — noodle firmness, broth richness, garlic level, spice intensity. No human interaction required. A quintessentially Tokyo experience."
          where: "Ichiran, Shibuya (24/7) or Shinjuku. Multiple locations across Tokyo."
          price: "¥980–1,380"
          dietary: "Pork-based broth. Not halal. Not vegetarian. Extra noodles (kae-dama) ¥210."
      - name: "Tempura at Daikokuya"
        extended:
          description: "One of Asakusa's oldest tempura restaurants (since 1887). Their tendon (tempura rice bowl) features a mountain of perfectly fried prawns and vegetables over rice, drenched in a sweet-savoury sauce. Worth the queue."
          where: "Daikokuya, Asakusa — 5 min from Senso-ji"
          price: "¥1,500–2,500 (tendon set)"
          dietary: "Contains shrimp, wheat, egg. Vegetable tempura available."
      - name: "Conveyor belt sushi at Uobei"
        extended:
          description: "High-speed conveyor belt sushi where you order via touchscreen and plates zoom to your seat on an express lane. Fun, fast, and surprisingly high quality for the price. Popular with locals and families."
          where: "Uobei, Shibuya — near Shibuya 109"
          price: "¥100–300 per plate. Full meal: ¥1,000–2,000"
          dietary: "Fish, shellfish. Some vegetable and egg options. Not fully vegetarian-friendly."
