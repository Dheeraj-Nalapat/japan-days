cities:
  - name: "Osaka"
    items:
      - name: "Takoyaki at Kukuru 🐙"
        extended:
          description: "Crispy-outside, gooey-inside octopus balls — Osaka's most iconic street food. Kukuru uses whole octopus legs for a more generous filling."
          where: "Kukuru, Dotonbori — look for the giant octopus sign"
          price: "¥500–700 for 8 pieces"
          dietary: "Contains wheat, egg, octopus. Not vegetarian."
      - name: "Okonomiyaki at Mizuno"
        extended:
          description: "Osaka-style savoury pancake — all ingredients mixed into the batter. Mizuno has been perfecting their recipe since 1945 with a yam-based batter that's impossibly fluffy."
          where: "Mizuno, Dotonbori — 1 min from Glico Man"
          price: "¥1,000–1,800"
          dietary: "Contains wheat, egg, pork. Not vegetarian."
      - name: "Kushikatsu at Daruma 🍢"
        extended:
          description: "Deep-fried skewered meat and vegetables dipped in tangy sauce. Shinsekai's signature dish. The golden rule: never double-dip."
          where: "Daruma, Shinsekai — the shop with the angry chef statue"
          price: "¥100–200 per skewer. Full meal ¥1,500–2,500"
          dietary: "Meat and seafood options. Some vegetable skewers. Contains wheat."
      - name: "Ramen at Kinryu 🍜"
        extended:
          description: "24-hour tonkotsu ramen joint with a giant dragon sign. Rich, porky, and cheap — quintessential Osaka late-night fuel."
          where: "Kinryu Ramen, Dotonbori — under the golden dragon"
          price: "¥600–900"
          dietary: "Pork-based broth. Not halal. Not vegetarian."
      - name: "Tsuruhashi Yakiniku BBQ 🥩"
        extended:
          description: "Japan's largest Koreatown — packed with yakiniku BBQ joints grilling premium short rib, tongue, and harami over charcoal. The smoke-filled alleys are intoxicating."
          where: "Tsuruhashi Koreatown — 5 min walk from Tsuruhashi Station"
          price: "¥1,500–3,000 per person (all-you-can-eat options available)"
          dietary: "Beef, pork. Some vegetable options. Not vegetarian."

  - name: "Koyasan"
    items:
      - name: "Shojin Ryori (temple cuisine) 🌿"
        extended:
          description: "Exquisite Buddhist vegetarian multi-course meal — seasonal vegetables, tofu, sesame, and mountain herbs prepared with extraordinary care. Every dish is a meditation. Served at your temple stay."
          where: "Included with shukubo (temple stay) — dinner and breakfast"
          price: "Included in temple stay (typically ₹6,000/night)"
          dietary: "Vegetarian. Often vegan (no dairy/egg). Gluten varies by dish."
      - name: "Goma-dofu (sesame tofu) 🥢"
        extended:
          description: "Koyasan's signature dish — silky, rich tofu made from ground sesame seeds and kuzu starch, served chilled with wasabi and soy sauce. Utterly unlike regular tofu — dense, creamy, and intensely nutty."
          where: "Any shukubo meal or Koyasan restaurants like Hanabishi"
          price: "¥300–500 (as a side dish). Included in shukubo meals."
          dietary: "Vegetarian. Vegan. Gluten-free."

  - name: "Nara"
    items:
      - name: "Kakinoha-zushi 🍣"
        extended:
          description: "Nara's traditional pressed sushi — vinegared rice topped with mackerel or salmon, wrapped in persimmon leaves. The leaf imparts a subtle fragrance and acts as a natural preservative. A delicacy dating back centuries."
          where: "Tanaka (near Kintetsu Nara Station) or Hiraso (near Todai-ji)"
          price: "¥800–1,200 for a box set"
          dietary: "Contains fish, rice. Not vegetarian. Gluten-free."
      - name: "Mochi (rice cakes) at Nakatanidou 🍡"
        extended:
          description: "Freshly pounded mochi — watch the mesmerising high-speed mochi-pounding performance where two workers alternate hammer swings at incredible speed. The resulting mochi is impossibly soft and warm."
          where: "Nakatanidou, near Kintetsu Nara Station — look for the crowd watching the pounding"
          price: "¥150–300 per piece"
          dietary: "Rice, red bean paste. Gluten-free. Vegetarian."

  - name: "Kobe"
    items:
      - name: "Kobe Beef Teppanyaki 🥩"
        extended:
          description: "Japan's most famous beef — intensely marbled wagyu from Tajima cattle. A teppanyaki set gives you the full show: chef sears the steak on an iron plate with garlic chips and seasonal vegetables."
          where: "Kitano or Sannomiya area — look for official Kobe beef certificate displayed"
          price: "¥3,000–5,000 (lunch set). Dinner: ¥8,000+"
          dietary: "Beef. Not vegetarian. Not halal."
      - name: "Kobe Cheesecake 🧁"
        extended:
          description: "Kobe's famous jiggly Japanese cheesecake — light, fluffy, and barely sweet. Uncle Rikuro's (Rikuro Ojisan) bakes them fresh throughout the day and stamps each one with a branding iron."
          where: "Rikuro Ojisan no Mise, Sannomiya — queues form when fresh batches come out"
          price: "¥850 for a whole cake"
          dietary: "Contains dairy, egg, wheat. Not vegan."

  - name: "Kyoto"
    items:
      - name: "Kaiseki lunch set 🍱"
        extended:
          description: "Traditional Japanese haute cuisine — multi-course meal of seasonal dishes presented as edible art. Lunch sets offer the kaiseki experience at a fraction of dinner prices."
          where: "Gion Nanba or Kikunoi (Michelin-starred). Budget: Gion Kappa"
          price: "¥3,000–5,000 (lunch). Dinner: ¥15,000+"
          dietary: "Usually contains fish, seafood, egg. Advance notice needed for dietary restrictions."
      - name: "Yudofu tofu hot pot 🍲"
        extended:
          description: "Kyoto's signature vegetarian dish — silky tofu simmered in kombu broth. Simple, elegant, deeply warming. A Zen Buddhist tradition."
          where: "Nanzenji Junsei or Tousuiro near Kiyomizu"
          price: "¥1,500–3,000"
          dietary: "Vegetarian. Vegan if you skip bonito dipping sauce. Gluten-free."
      - name: "Matcha parfait — Nakamura Tokichi 🍵"
        extended:
          description: "Layers of matcha ice cream, jelly, cake, azuki beans — from one of Kyoto's oldest tea merchants (est. 1854). The matcha is intensely bitter-sweet."
          where: "Nakamura Tokichi, Uji (30 min) or Kyoto Station branch"
          price: "¥1,200–1,500"
          dietary: "Contains dairy, egg, wheat. Not vegan."
      - name: "Pontocho riverside dinner 🍶"
        extended:
          description: "Dining along Pontocho alley beside the Kamo River. In warm months, restaurants extend wooden terraces (yuka) over the river."
          where: "Pontocho Alley, between Sanjo and Shijo bridges"
          price: "¥2,000–5,000 (izakaya). ¥8,000+ (kaiseki)"
          dietary: "Varies by restaurant. Most offer fish and meat."

  - name: "Hiroshima"
    items:
      - name: "Hiroshima okonomiyaki (Okonomi-mura) 🥞"
        extended:
          description: "Hiroshima-style is layered, not mixed — thin batter, mountain of cabbage, pork belly, yakisoba noodles, and egg. Completely different from Osaka-style."
          where: "Okonomi-mura (6-floor building). Upper floors less crowded."
          price: "¥800–1,200"
          dietary: "Contains wheat, egg, pork. Not vegetarian."
      - name: "Fresh grilled oysters 🦪"
        extended:
          description: "Hiroshima produces 60% of Japan's oysters. October is start of peak season — plump, sweet, and enormous."
          where: "Miyajima island stalls, or Ekiichi near Hiroshima Station"
          price: "¥200–400 per oyster"
          dietary: "Shellfish. Gluten-free."
      - name: "Tsukemen dipping ramen 🍜"
        extended:
          description: "Cold noodles with concentrated hot broth for dipping. Hiroshima's version uses thick, chewy noodles with rich seafood-pork broth."
          where: "Bakudanya (multiple locations)"
          price: "¥850–1,100"
          dietary: "Contains wheat, pork, seafood. Not vegetarian."

  - name: "Tokyo"
    items:
      - name: "Tsukiji sushi breakfast 🍣"
        extended:
          description: "Ultra-fresh sushi for breakfast at the outer market. 400+ shops remain — and the sushi is legendary."
          where: "Tsukiji Outer Market. Tsukiji Sushi-Sei for no-wait quality."
          price: "¥2,000–4,000 (omakase set)"
          dietary: "Raw fish. Not vegetarian."
      - name: "Yakitori under Yurakucho tracks 🍗"
        extended:
          description: "Smoky yakitori joints under the JR railway tracks. Trains rumble overhead as you eat perfectly grilled chicken — heart, skin, thigh, tsukune."
          where: "Yurakucho Station west side — under the arches"
          price: "¥150–300 per skewer. Full meal: ¥2,000–3,000"
          dietary: "Chicken, some pork. Not vegetarian."
      - name: "Ichiran solo ramen booth 🍜"
        extended:
          description: "Tonkotsu ramen in individual curtained booths. Customise everything via paper form — firmness, richness, garlic, spice."
          where: "Ichiran, Shibuya (24/7) or Shinjuku"
          price: "¥980–1,380"
          dietary: "Pork-based. Not halal. Not vegetarian."
      - name: "Tempura at Daikokuya 🍤"
        extended:
          description: "Asakusa's oldest tempura restaurant (since 1887). Mountain of fried prawns and vegetables over rice."
          where: "Daikokuya, Asakusa — 5 min from Senso-ji"
          price: "¥1,500–2,500 (tendon set)"
          dietary: "Contains shrimp, wheat, egg. Vegetable tempura available."
      - name: "Conveyor belt sushi at Uobei 🍣"
        extended:
          description: "High-speed conveyor sushi — order via touchscreen and plates zoom to your seat. Fun, fast, surprisingly high quality."
          where: "Uobei, Shibuya — near Shibuya 109"
          price: "¥100–300 per plate. Full meal: ¥1,000–2,000"
          dietary: "Fish, shellfish. Some vegetable options."
