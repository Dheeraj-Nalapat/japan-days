groups:
  - title: "Documents & Bookings"
    items:
      - "Apply for Japan Visa (Indian passport — Japanese Consulate, Chennai/Delhi/Mumbai)"
      - "Buy JR Pass online before departing India — saves ~30% vs buying at airport"
      - "Book Peach Aviation KIX → OKA (around Oct 18, Tues/Wed cheapest)"
      - "Book Jetstar Japan OKA → NRT (around Oct 21, ~$47)"
      - "⚠️ Note rescheduled flight XJ 610: departs DMK 09:50 (was 12:00) — be at airport by 06:50"
      - "Book Shinkansen reserved seats (Hiroshima ↔ Tokyo) in advance"
      - "International Driving Permit (RTO) if renting car in Okinawa"

  - title: "Tech & Money"
    items:
      - "Pre-book Pocket Wi-Fi or Japan SIM at KIX arrivals (IIJmio or Mobal)"
      - "Exchange some INR to JPY before departure (better rates than airport)"
      - "Inform bank of international travel dates"
      - "Download Google Maps offline packs: Osaka, Kyoto, Hiroshima, Okinawa, Tokyo"
      - "Download Google Translate Japanese offline pack"
      - "Book Churaumi Aquarium tickets online (sells out in October)"
      - "Check AirAsia baggage allowance for PNR G9395C"

  - title: "Packing"
    items:
      - "Comfortable walking shoes (15,000+ steps/day expected)"
      - "Light jacket + layers (Osaka/Kyoto: 15–22°C · Okinawa: 24–28°C · Tokyo: 14–20°C)"
      - "Power bank (Type A plug — same as India, no adapter needed ✅)"
      - "Cash wallet (Japan is still very cash-heavy — JPY essential)"

  - title: "At the Airport"
    items:
      - "Get Suica IC Card at KIX on arrival (works for trains + buses + vending machines nationwide)"
      - "Activate JR Pass at KIX JR office on Day 1"
      - "Pick up Pocket Wi-Fi / SIM at KIX arrival hall"
