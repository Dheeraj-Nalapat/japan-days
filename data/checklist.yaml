groups:
  - title: "Documents & Bookings"
    items:
      - "Apply for Japan Visa (Indian passport — Japanese Consulate, Chennai/Delhi/Mumbai)"
      - "Book Kyoto→Hiroshima + Hiroshima→Tokyo shinkansen online via smartEX (no nationwide JR Pass — point-to-point is cheaper for this route)"
      - "Book Koyasan shukubo (temple stay) for Oct 14 at koyasan-shukubo.net — sells out in October, book early"
      - "Book Miyajima island stay for Oct 20 (Mikuniya / Sakuraya) — tiny inventory, peak foliage"
      - "Book 9h nine hours capsule inside Narita Terminal 2 for Oct 23 (for the 05:45 flight)"
      - "⚠️ Note rescheduled flight XJ 610: departs DMK 09:50 (was 12:00) — be at airport by 06:50"

  - title: "Osaka & Kansai Bookings"
    items:
      - "Book Hommachi/Shinsaibashi hostel private room (booking.com / hostelworld) — Oct 11, 12, 13, 15 (book as 3 + 1 nights)"
      - "Buy Nankai Koyasan World Heritage Ticket (round trip + cable car + buses, ~¥3,140)"
      - "Buy Kintetsu day pass for Nara day (covers Namba↔Nara return)"
      - "Daruma Kushikatsu — no double dipping the sauce 🚫"

  - title: "Kyoto & West"
    items:
      - "Book Kyoto hostel (Piece Hostel Sanjo / Kyoto) — Oct 16–19"
      - "Reserve Kibune kawadoko lunch (Hirobun) 2–3 days ahead — confirm the platforms are still up for Oct 17"
      - "Buy Kansai-Hiroshima Area Pass ONLY if adding a Himeji/Sanyo side trip — otherwise point-to-point is cheaper"
      - "Reserve a window seat E (right side) on the Hiroshima→Tokyo shinkansen for the Mt Fuji view"

  - title: "Tech & Money"
    items:
      - "Pre-book Pocket Wi-Fi or Japan SIM at KIX arrivals (IIJmio or Mobal)"
      - "Exchange some INR to JPY before departure (better rates than airport)"
      - "Inform bank of international travel dates"
      - "Download Google Maps offline packs: Osaka, Kyoto, Hiroshima/Miyajima, Tokyo"
      - "Download Google Translate Japanese offline pack"
      - "Book Shibuya Sky timed slot online — sunset slots sell out"
      - "Check AirAsia baggage allowance for PNR G9395C"

  - title: "Packing"
    items:
      - "Comfortable walking shoes (15,000+ steps/day expected)"
      - "Light jacket + layers (Osaka/Kyoto: 15–22°C · Hiroshima/Miyajima: 16–22°C · Tokyo: 14–20°C)"
      - "Power bank (Type A plug — same as India, no adapter needed ✅)"
      - "Cash wallet (Japan is still very cash-heavy — JPY essential)"

  - title: "At the Airport"
    items:
      - "Load ¥5,000 on Suica/ICOCA IC Card at KIX on arrival"
      - "Pick up Pocket Wi-Fi / SIM at KIX arrival hall"
      - "No JR Pass to activate — buy shinkansen tickets in the smartEX app"
