summary:
  title: "The Buffer"
  paragraphs:
    - "Okinawa is out, so the internal flights (~₹11,000) are gone and there's no nationwide JR Pass. For this mainland route, point-to-point shinkansen tickets (~₹18,000) beat the ¥50,000 pass — buy Kyoto→Hiroshima and Hiroshima→Tokyo individually via smartEX."
    - "Accommodation is the swing factor: these figures assume hostel <strong>private rooms</strong> in peak-foliage October. Switching some nights to dorm beds would cut ~₹15,000–20,000 and widen the buffer."
    - "Note: XJ 610 was <strong>rescheduled</strong> from 12:00 to 09:50 (Bangkok → Osaka). Be at DMK by 06:50 at the latest."
  buffer_amount: "₹18,417 buffer"
  extra_note: "Book the Koyasan shukubo and the Miyajima island stay early — tiny inventory in peak season."
