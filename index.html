<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan 2026 — Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1208">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-jp">日本</div>
  <div class="loading-text">Loading travel plan...</div>
</div>

<nav id="nav">
  <a class="nav-logo" href="index.html">日本 2026</a>
  <div class="nav-links" id="navLinks"></div>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 Dark</button>
</nav>

<section class="hero" id="top">
  <div class="hero-bg"></div>
  <div class="hero-pattern"></div>
  <div class="hero-jp" id="heroJp"></div>
  <div class="hero-content">
    <div class="hero-label" id="heroLabel"></div>
    <h1 class="hero-title">Japan<br><em>2026</em></h1>
    <p class="hero-subtitle" id="heroSubtitle"></p>
    <div class="hero-meta" id="heroMeta"></div>
    <div class="hero-countdown" id="heroCountdown"></div>
  </div>
  <div class="hero-scroll">
    <div class="scroll-line"></div>
    <span>Scroll to explore</span>
  </div>
</section>

<section id="route" class="route-section">
  <div class="section-eyebrow">The Journey</div>
  <h2 class="section-title">Route Overview</h2>
  <div class="route-visual" id="routeVisual"></div>
</section>

<section id="dashboard" class="route-section">
  <div class="section-eyebrow">Your Plan</div>
  <h2 class="section-title">Dashboard</h2>
  <div class="dash-cards" id="dashCards"></div>
</section>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-panel" id="modalPanel">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<footer id="footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="js/shared.js"></script>
<script>
function renderHero(data) {
  const t = data.trip;
  document.getElementById('heroJp').textContent = t.hero_jp;
  document.getElementById('heroLabel').textContent = `${t.dates}  ·  ${t.duration}`;
  document.getElementById('heroSubtitle').textContent = t.route_summary;
  document.getElementById('heroMeta').innerHTML = t.meta.map(m =>
    `<div class="meta-item">
      <span class="label">${JD.esc(m.label)}</span>
      <span class="value">${JD.esc(m.value)}</span>
    </div>`
  ).join('');

  if (t.departure_date) {
    const cdEl = document.getElementById('heroCountdown');
    function updateCountdown() {
      const dep = new Date(t.departure_date);
      const now = new Date();
      const diff = dep - now;
      if (diff <= 0) {
        cdEl.innerHTML = '<span class="countdown-value">You\'re in Japan!</span> 🇯🇵';
        return;
      }
      const days = Math.floor(diff / 86400000);
      const hrs = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      cdEl.innerHTML = `<span class="countdown-value">${days}d ${hrs}h ${mins}m</span> until Japan`;
    }
    updateCountdown();
    setInterval(updateCountdown, 60000);
  }
}

function renderRoute(data) {
  const cityNames = new Set(data.itinerary.cities.map(c => c.name.toLowerCase()));
  const container = document.getElementById('routeVisual');
  let html = '';
  data.route.route.forEach(city => {
    const dotClass = city.transit ? 'city-dot transit' : 'city-dot';
    const dotStyle = city.special_style ? ` style="${city.special_style}"` : '';
    const slug = JD.citySlug(city.name);
    const hasBlock = cityNames.has(city.name.toLowerCase());
    const tag = hasBlock ? 'a' : 'div';
    const href = hasBlock ? ` href="itinerary.html#city-${slug}"` : '';
    html += `<${tag} class="route-city"${href}>
      <div class="${dotClass}"${dotStyle}></div>
      <div class="city-name">${JD.esc(city.name)}</div>
      <div class="city-dates">${JD.esc(city.dates)}</div>
      <div class="city-nights">${JD.esc(city.nights)}</div>
    </${tag}>`;
    if (city.line_after) {
      const lineClass = city.line_after === 'flight' ? 'route-line flight' : 'route-line';
      html += `<div class="${lineClass}"></div>`;
    }
  });
  container.innerHTML = html;
}

function renderDashboard(data) {
  const daysMatch = (data.trip.duration || '').match(/(\d+)\s*[Dd]ays?/);
  const dayCount = daysMatch ? daysMatch[1] : data.itinerary.cities.reduce((n, c) => n + (c.days ? c.days.length : 0), 0);
  const cityCount = data.itinerary.cities.length;

  const stays = data.accommodation?.stays || [];
  const bookedStays = stays.filter(s => s.status === 'booked' || s.status === 'book').length;
  const pendingStays = stays.filter(s => s.status === 'pending').length;

  const reqs = data.visa?.requirements || [];
  const visaDone = reqs.filter(r => r.status === 'done').length;
  const visaTotal = reqs.length;

  const saved = JSON.parse(localStorage.getItem('jd-checklist') || '{}');
  let checklistTotal = 0;
  let checklistDone = 0;
  (data.checklist?.groups || []).forEach((group, gi) => {
    group.items.forEach((item, ii) => {
      checklistTotal++;
      if (saved[`${gi}-${ii}`]) checklistDone++;
    });
  });

  document.getElementById('dashCards').innerHTML = `
    <a class="dash-card" href="itinerary.html">
      <div class="dash-card-eyebrow">Itinerary</div>
      <div class="dash-card-title">Day by Day</div>
      <div class="dash-card-stat">${dayCount} days across ${cityCount} cities</div>
      <div class="dash-card-arrow">→</div>
    </a>
    <a class="dash-card" href="logistics.html">
      <div class="dash-card-eyebrow">Logistics</div>
      <div class="dash-card-title">Flights & Stays</div>
      <div class="dash-card-stat">${bookedStays} booked · ${pendingStays} pending</div>
      <div class="dash-card-arrow">→</div>
    </a>
    <a class="dash-card" href="explore.html">
      <div class="dash-card-eyebrow">Explore</div>
      <div class="dash-card-title">Discover Japan</div>
      <div class="dash-card-stat">Hidden gems, food guide & map</div>
      <div class="dash-card-arrow">→</div>
    </a>
    <a class="dash-card" href="visa.html">
      <div class="dash-card-eyebrow">Visa</div>
      <div class="dash-card-title">Application</div>
      <div class="dash-card-stat">${visaDone}/${visaTotal} requirements done</div>
      <div class="dash-card-arrow">→</div>
    </a>
    <a class="dash-card" href="checklist.html">
      <div class="dash-card-eyebrow">Checklist</div>
      <div class="dash-card-title">Pre-Departure</div>
      <div class="dash-card-stat">${checklistDone}/${checklistTotal} items checked</div>
      <div class="dash-card-arrow">→</div>
    </a>`;
}

JD.boot(['trip', 'route', 'itinerary', 'accommodation', 'visa', 'budget', 'checklist'], async function(data) {
  renderHero(data);
  renderRoute(data);
  renderDashboard(data);
});
</script>
</body>
</html>
