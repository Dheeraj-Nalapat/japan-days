<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan 2026 — Dheeraj's Travel Plan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --paper: #f5f0e8;
    --cream: #ede7d5;
    --vermilion: #c0392b;
    --gold: #b8860b;
    --sage: #6b7c5e;
    --mist: #8fa3a8;
    --sakura: #e8c4c4;
    --deep: #2c1810;
    --torii: #d4521a;
  }

  [data-theme="dark"] {
    --ink: #e8e0d4;
    --paper: #121212;
    --cream: #1a1a1a;
    --deep: #0a0a0a;
    --mist: #6a7a80;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow-x: hidden;
  }

  /* ── LOADING STATE ─────────────────────────── */
  .loading-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--deep);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }
  .loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loading-jp {
    font-family: 'Noto Serif JP', serif;
    font-weight: 200;
    font-size: 2.5rem;
    color: rgba(245,240,232,0.15);
    letter-spacing: 0.3em;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .loading-text {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: var(--torii);
    text-transform: uppercase;
    margin-top: 1.5rem;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* ── HERO ───────────────────────────────────── */
  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto;
    position: relative;
    overflow: hidden;
    background: var(--deep);
  }

  .hero-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 70% 40%, rgba(192,57,43,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 50% 80% at 20% 80%, rgba(184,134,11,0.1) 0%, transparent 50%),
      linear-gradient(160deg, #1a0f08 0%, #2c1810 40%, #1a1a2e 100%);
  }

  .hero-pattern {
    position: absolute; inset: 0;
    opacity: 0.04;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(255,255,255,0.5) 60px, rgba(255,255,255,0.5) 61px),
      repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,255,255,0.5) 60px, rgba(255,255,255,0.5) 61px);
  }

  .hero-content {
    position: relative; z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 6rem 8vw 4rem;
    max-width: 1100px;
  }

  .hero-jp {
    font-family: 'Noto Serif JP', serif;
    font-weight: 200;
    font-size: clamp(3rem, 10vw, 7rem);
    color: rgba(255,255,255,0.08);
    letter-spacing: 0.3em;
    line-height: 1;
    position: absolute;
    right: 4vw;
    top: 50%;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    animation: fadeIn 2s ease forwards;
  }

  .hero-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--torii);
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    animation: slideUp 0.8s ease forwards;
    opacity: 0;
    animation-delay: 0.2s;
  }

  .hero-title {
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    font-weight: 300;
    color: var(--paper);
    line-height: 1.1;
    letter-spacing: -0.02em;
    animation: slideUp 0.8s ease forwards;
    opacity: 0;
    animation-delay: 0.4s;
  }

  .hero-title em {
    font-style: italic;
    color: var(--torii);
  }

  .hero-subtitle {
    margin-top: 1.5rem;
    font-size: 1.2rem;
    font-weight: 300;
    color: rgba(245,240,232,0.5);
    letter-spacing: 0.05em;
    animation: slideUp 0.8s ease forwards;
    opacity: 0;
    animation-delay: 0.6s;
  }

  .hero-meta {
    display: flex;
    gap: 2.5rem;
    margin-top: 3rem;
    flex-wrap: wrap;
    animation: slideUp 0.8s ease forwards;
    opacity: 0;
    animation-delay: 0.8s;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .meta-item .label {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--mist);
    text-transform: uppercase;
  }
  .meta-item .value {
    font-size: 1.1rem;
    color: var(--paper);
    font-weight: 300;
  }

  .hero-countdown {
    position: relative; z-index: 2;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(245,240,232,0.35);
    margin-top: 1.5rem;
  }
  .hero-countdown .countdown-value {
    color: var(--torii);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
  }

  .hero-scroll {
    position: relative; z-index: 2;
    padding: 2rem 8vw;
    display: flex;
    align-items: center;
    gap: 1rem;
    animation: fadeIn 1.5s ease forwards;
    animation-delay: 1.2s;
    opacity: 0;
  }
  .hero-scroll span {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }
  .scroll-line {
    width: 60px; height: 1px;
    background: rgba(255,255,255,0.2);
    position: relative;
    overflow: hidden;
  }
  .scroll-line::after {
    content: '';
    position: absolute;
    left: -100%; top: 0;
    width: 100%; height: 100%;
    background: var(--torii);
    animation: scanline 2s ease-in-out infinite;
  }

  /* ── FLIGHTS STRIP ──────────────────────────── */
  .flights-strip {
    background: var(--ink);
    padding: 0;
    overflow: hidden;
    position: relative;
  }
  .flights-strip::before,
  .flights-strip::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 60px;
    z-index: 2;
    pointer-events: none;
  }
  .flights-strip::before {
    left: 0;
    background: linear-gradient(90deg, var(--ink), transparent);
  }
  .flights-strip::after {
    right: 0;
    background: linear-gradient(-90deg, var(--ink), transparent);
  }

  .flights-ticker {
    display: flex;
    gap: 0;
    animation: tickerScroll 30s linear infinite;
    width: max-content;
    cursor: grab;
  }
  .flights-ticker:active { cursor: grabbing; }
  .flights-ticker:hover { animation-play-state: paused; }

  @keyframes tickerScroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .flight-card {
    display: flex;
    align-items: center;
    gap: 2rem;
    padding: 2.5rem 3rem;
    border-right: 1px solid rgba(255,255,255,0.06);
    min-width: 320px;
    flex-shrink: 0;
    position: relative;
    transition: background 0.3s;
  }
  .flight-card:hover { background: rgba(255,255,255,0.03); }

  .flight-card .badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    padding: 0.3rem 0.7rem;
    background: var(--torii);
    color: white;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .flight-route {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .airport-code {
    font-family: 'Space Mono', monospace;
    font-size: 1.3rem;
    color: var(--paper);
    letter-spacing: 0.1em;
  }
  .route-arrow {
    color: var(--torii);
    font-size: 1rem;
  }
  .flight-detail {
    font-size: 0.85rem;
    color: rgba(245,240,232,0.4);
    line-height: 1.6;
  }
  .flight-time {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--gold);
    margin-top: 0.3rem;
  }
  .flight-num {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: rgba(245,240,232,0.25);
    letter-spacing: 0.1em;
  }

  .rescheduled-tag {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    padding: 0.2rem 0.5rem;
    background: rgba(212, 82, 26, 0.2);
    color: var(--torii);
    border: 1px solid rgba(212, 82, 26, 0.4);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    display: inline-block;
    margin-top: 0.4rem;
  }

  /* ── SECTION BASE ───────────────────────────── */
  section { padding: 7rem 8vw; }

  .section-eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: var(--torii);
    text-transform: uppercase;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .section-eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--torii);
    opacity: 0.3;
    max-width: 80px;
  }

  .section-title {
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 3rem;
  }

  /* ── ROUTE MAP ──────────────────────────────── */
  .route-section { background: var(--cream); }

  .route-visual {
    display: flex;
    align-items: center;
    gap: 0;
    overflow-x: auto;
    padding: 3rem 0;
    scrollbar-width: none;
  }
  .route-visual::-webkit-scrollbar { display: none; }

  .route-city {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    min-width: 120px;
    cursor: pointer;
    transition: transform 0.3s;
  }
  .route-city:hover { transform: translateY(-4px); }

  .city-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--torii);
    border: 3px solid var(--cream);
    box-shadow: 0 0 0 2px var(--torii);
    position: relative;
    z-index: 2;
  }
  .city-dot.transit {
    background: var(--mist);
    box-shadow: 0 0 0 2px var(--mist);
  }

  .city-name {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-align: center;
    text-transform: uppercase;
  }
  .city-dates {
    font-size: 0.65rem;
    color: var(--mist);
    font-family: 'Space Mono', monospace;
    text-align: center;
  }
  .city-nights {
    font-size: 0.6rem;
    background: var(--ink);
    color: var(--paper);
    padding: 0.15rem 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: 'Space Mono', monospace;
  }

  .route-line {
    flex: 1;
    height: 1px;
    background: repeating-linear-gradient(90deg, var(--torii) 0, var(--torii) 6px, transparent 6px, transparent 14px);
    min-width: 40px;
    position: relative;
    top: -22px;
  }
  .route-line.flight::before {
    content: '✈';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.9rem;
    color: var(--torii);
  }

  /* ── BUDGET ─────────────────────────────────── */
  .budget-section { background: var(--paper); }

  .budget-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: start;
  }

  .budget-bars { display: flex; flex-direction: column; gap: 1.2rem; }

  .budget-item {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .budget-item-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .budget-name {
    font-size: 0.85rem;
    font-weight: 400;
    color: var(--ink);
  }
  .budget-amount {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--torii);
  }
  .budget-bar-track {
    height: 3px;
    background: rgba(26,18,8,0.1);
    border-radius: 2px;
    overflow: hidden;
  }
  .budget-bar-fill {
    height: 100%;
    background: var(--torii);
    border-radius: 2px;
    transform: scaleX(0);
    transform-origin: left;
    animation: growBar 1.2s cubic-bezier(0.4,0,0.2,1) forwards;
    animation-play-state: paused;
  }
  .budget-bar-fill.animate { animation-play-state: running; }

  .budget-total {
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid rgba(26,18,8,0.15);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .budget-total .label {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--mist);
  }
  .budget-total .big {
    font-size: 2rem;
    font-weight: 300;
    color: var(--torii);
  }

  .budget-summary {
    background: var(--ink);
    color: var(--paper);
    padding: 2.5rem;
  }
  .budget-summary h3 {
    font-size: 1.3rem;
    font-weight: 300;
    margin-bottom: 1.5rem;
    letter-spacing: -0.01em;
  }
  .budget-summary p {
    font-size: 0.9rem;
    line-height: 1.8;
    color: rgba(245,240,232,0.6);
    margin-bottom: 1.5rem;
  }
  .buffer-amount {
    font-family: 'Space Mono', monospace;
    font-size: 1.8rem;
    color: var(--sage);
    display: block;
    margin-top: 1rem;
  }

  /* ── ITINERARY ──────────────────────────────── */
  .itinerary-section { background: var(--ink); }
  .itinerary-section .section-title { color: var(--paper); }
  .itinerary-section .section-eyebrow { color: var(--torii); }

  .city-blocks { display: flex; flex-direction: column; gap: 4rem; }

  .city-block {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 3rem;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .city-block.visible { opacity: 1; transform: translateY(0); }

  .city-header {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    padding-top: 0.5rem;
    position: sticky;
    top: 2rem;
    align-self: start;
  }

  .city-header-img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    background: linear-gradient(135deg, rgba(26,18,8,0.3), rgba(107,124,94,0.2));
    border-radius: 2px;
    opacity: 0.85;
    transition: opacity 0.4s;
    margin-bottom: 0.5rem;
  }
  .city-block:hover .city-header-img { opacity: 1; }

  .city-flag {
    font-size: 2.5rem;
    line-height: 1;
  }

  .city-block-name {
    font-size: 1.5rem;
    font-weight: 300;
    color: var(--paper);
    letter-spacing: 0.05em;
  }
  .city-block-jp {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.1rem;
    font-weight: 200;
    color: rgba(245,240,232,0.25);
  }
  .city-block-dates {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--torii);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .city-block-nights {
    font-size: 0.75rem;
    color: rgba(245,240,232,0.35);
    font-family: 'Space Mono', monospace;
  }

  .day-list { display: flex; flex-direction: column; gap: 0; }

  .day-entry {
    display: grid;
    grid-template-columns: 80px 1fr;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 1.8rem 0;
    gap: 2rem;
  }

  .day-num {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--torii);
    letter-spacing: 0.15em;
    padding-top: 0.3rem;
  }
  .day-date {
    font-size: 0.7rem;
    color: rgba(245,240,232,0.25);
    font-family: 'Space Mono', monospace;
    display: block;
    margin-top: 0.3rem;
  }

  .day-content h4 {
    font-size: 1rem;
    font-weight: 400;
    color: var(--paper);
    margin-bottom: 1rem;
    letter-spacing: 0.03em;
  }

  .places-list { display: flex; flex-direction: column; gap: 0.6rem; }

  .place-item {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
  }

  .place-tag {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    padding: 0.2rem 0.5rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .place-tag.quiet { background: rgba(107,124,94,0.25); color: var(--sage); border: 1px solid rgba(107,124,94,0.4); }
  .place-tag.main { background: rgba(212,82,26,0.15); color: var(--torii); border: 1px solid rgba(212,82,26,0.35); }
  .place-tag.food { background: rgba(184,134,11,0.15); color: var(--gold); border: 1px solid rgba(184,134,11,0.3); }

  .place-desc {
    font-size: 0.88rem;
    line-height: 1.6;
    color: rgba(245,240,232,0.55);
  }
  .place-name {
    color: var(--paper);
    font-weight: 400;
  }
  .place-maps {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.08em;
    color: rgba(245,240,232,0.25);
    text-decoration: none;
    margin-left: 0.4rem;
    opacity: 0;
    transition: opacity 0.2s, color 0.2s;
    vertical-align: middle;
  }
  .place-item:hover .place-maps { opacity: 1; }
  .place-maps:hover { color: var(--torii); }

  /* ── QUIET PLACES ───────────────────────────── */
  .quiet-section { background: var(--cream); }

  .quiet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
  }

  .quiet-card {
    background: var(--paper);
    border-left: 3px solid var(--sage);
    transition: transform 0.3s, box-shadow 0.3s;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .quiet-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(26,18,8,0.12);
  }

  .quiet-card-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    transition: transform 0.5s;
    background: linear-gradient(135deg, rgba(26,18,8,0.15), rgba(107,124,94,0.12));
  }
  .quiet-card:hover .quiet-card-img { transform: scale(1.05); }

  .quiet-card-body {
    padding: 1.5rem 2rem 2rem;
  }

  .quiet-card .city-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--mist);
    margin-bottom: 0.6rem;
  }
  .quiet-card h3 {
    font-size: 1.05rem;
    font-weight: 400;
    margin-bottom: 0.5rem;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .quiet-card p {
    font-size: 0.82rem;
    line-height: 1.7;
    color: rgba(26,18,8,0.55);
  }
  .crowd-meter {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1rem;
  }
  .crowd-dots { display: flex; gap: 3px; }
  .crowd-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(26,18,8,0.15); }
  .crowd-dot.filled { background: var(--sage); }
  .crowd-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    color: var(--sage);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .gem-maps-link {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(26,18,8,0.3);
    text-decoration: none;
    margin-top: 0.8rem;
    padding: 0.3rem 0.6rem;
    border: 1px solid rgba(26,18,8,0.1);
    border-radius: 3px;
    transition: all 0.2s;
  }
  .gem-maps-link:hover {
    color: var(--torii);
    border-color: var(--torii);
  }

  [data-theme="dark"] .modal-panel { background: #1a1a1a; }

  [data-theme="dark"] .modal-tip { background: rgba(184,134,11,0.08); }

  [data-theme="dark"] .modal-activity { background: rgba(107,124,94,0.1); }

  .place-item { cursor: pointer; transition: background 0.2s; }

  [data-theme="dark"] .route-section,

</style>

    <div class="hero-countdown" id="heroCountdown"></div>
  </div>
  <div class="hero-scroll">
    <div class="scroll-line"></div>
    <span>Scroll to explore</span>
  </div>
</section>

<div id="flights" class="flights-strip">
  <div class="flights-ticker" id="flightsTicker"></div>
</div>

<!-- ── ROUTE ──────────────────────────────── -->
<section id="route" class="route-section">
  <div class="section-eyebrow">The Journey</div>
  <h2 class="section-title">Route Overview</h2>
  <div class="route-visual" id="routeVisual"></div>
</section>

<!-- ── ITINERARY ──────────────────────────── -->
<section id="itinerary" class="itinerary-section">
  <div class="section-eyebrow">Day by Day</div>
  <h2 class="section-title" style="color:var(--paper);">Full Itinerary</h2>
  <div class="city-blocks" id="cityBlocks"></div>
</section>

<!-- ── QUIET PLACES ────────────────────────── -->
<section id="quiet" class="quiet-section">
  <div class="section-eyebrow">Off the Beaten Path</div>
  <h2 class="section-title">Hidden Gems — Crowd Guide</h2>
  <div class="quiet-grid" id="quietGrid"></div>
</section>

<!-- ── BUDGET ──────────────────────────────── -->
<section id="budget" class="budget-section">
  <div class="section-eyebrow">Money</div>
  <h2 class="section-title">Budget Breakdown</h2>
  <div class="budget-grid" id="budgetGrid"></div>
</section>

<!-- ── FOOD ────────────────────────────────── -->
<section class="food-section">
  <div class="section-eyebrow">Eat</div>
  <h2 class="section-title">Must-Try Foods by City</h2>
  <div class="food-grid" id="foodGrid"></div>
</section>

<section id="checklist" class="checklist-section">
  <div class="section-eyebrow">Prepare</div>
  <h2 class="section-title">Pre-Departure Checklist</h2>
  <div class="checklist-grid" id="checklistGrid"></div>
</section>

<!-- ── MODAL ──────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-panel" id="modalPanel">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<!-- ── SHARE ──────────────────────────────── -->
<div class="share-section" id="shareSection">
  <div class="share-label">Share & Export</div>
  <div class="share-buttons">
    <button class="share-btn" id="btnShare" onclick="shareTrip()" style="display:none">📤 Share</button>
    <button class="share-btn" onclick="exportICS()">📅 Calendar (.ics)</button>
    <button class="share-btn" onclick="toggleQR()">🔳 QR Code</button>
  </div>
  <div id="qrContainer"></div>
</div>

<footer id="footer"></footer>

<!-- ── DATA ENGINE ─────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(async function JapanDays() {
  const DATA_DIR = 'data';
  const FILES = ['trip', 'flights', 'route', 'itinerary', 'hidden-gems', 'budget', 'food', 'checklist'];

  async function loadYAML(name) {
    const res = await fetch(`${DATA_DIR}/${name}.yaml`);
    if (!res.ok) throw new Error(`Failed to load ${name}.yaml: ${res.status}`);
    const text = await res.text();
    return jsyaml.load(text);
  }

  async function loadAllData() {
    const entries = await Promise.all(FILES.map(async f => [f, await loadYAML(f)]));
    return Object.fromEntries(entries);
  }

  function esc(str) {
    const el = document.createElement('span');
    el.textContent = str;
    return el.innerHTML;
  }

  // ── Renderers ──────────────────────────────

  function renderNav(data) {
    const container = document.getElementById('navLinks');
    container.innerHTML = data.trip.nav_links.map(l =>
      `<a href="${esc(l.href)}">${esc(l.text)}</a>`
    ).join('');
  }

  function renderHero(data) {
    const t = data.trip;
    document.getElementById('heroJp').textContent = t.hero_jp;
    document.getElementById('heroLabel').textContent = `${t.dates}  ·  ${t.duration}`;
    document.getElementById('heroSubtitle').textContent = t.route_summary;
    document.getElementById('heroMeta').innerHTML = t.meta.map(m =>
      `<div class="meta-item">
        <span class="label">${esc(m.label)}</span>
        <span class="value">${esc(m.value)}</span>
      </div>`
    ).join('');

    if (t.departure_date) {
      const cdEl = document.getElementById('heroCountdown');
      function updateCountdown() {
        const dep = new Date(t.departure_date);
        const now = new Date();
        const diff = dep - now;
        if (diff <= 0) {
          cdEl.innerHTML = '<span class="countdown-value">You\'re in Japan!</span> 🇯🇵';
          return;
        }
        const days = Math.floor(diff / 86400000);
        const hrs = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        cdEl.innerHTML = `<span class="countdown-value">${days}d ${hrs}h ${mins}m</span> until Japan`;
      }
      updateCountdown();
      setInterval(updateCountdown, 60000);
    }
  }

  function renderFlights(data) {
    const container = document.getElementById('flightsTicker');
    const cardsHTML = data.flights.flights.map(f => {
      const badgeStyle = f.badge_style ? ` style="${esc(f.badge_style)}"` : '';
      const rescheduledHTML = f.rescheduled
        ? `<div class="rescheduled-tag">${esc(f.rescheduled_note)}</div>` : '';
      return `<div class="flight-card">
        <div class="badge"${badgeStyle}>${esc(f.badge)}</div>
        <div>
          <div class="flight-route">
            <span class="airport-code">${esc(f.from_code)}</span>
            <span class="route-arrow">→</span>
            <span class="airport-code">${esc(f.to_code)}</span>
          </div>
          <div class="flight-detail">${esc(f.from_city)} → ${esc(f.to_city)}</div>
          <div class="flight-time">${esc(f.time)}</div>
          <div class="flight-num">${esc(f.flight_num)}</div>
          ${rescheduledHTML}
        </div>
      </div>`;
    }).join('');
    container.innerHTML = cardsHTML + cardsHTML;
  }

  function citySlug(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  function renderRoute(data) {
    const cityNames = new Set(data.itinerary.cities.map(c => c.name.toLowerCase()));
    const container = document.getElementById('routeVisual');
    let html = '';
    data.route.route.forEach((city, i) => {
      const dotClass = city.transit ? 'city-dot transit' : 'city-dot';
      const dotStyle = city.special_style ? ` style="${city.special_style}"` : '';
      const slug = citySlug(city.name);
      const hasBlock = cityNames.has(city.name.toLowerCase());
      const tag = hasBlock ? 'a' : 'div';
      const href = hasBlock ? ` href="#city-${slug}"` : '';
      html += `<${tag} class="route-city"${href}>
        <div class="${dotClass}"${dotStyle}></div>
        <div class="city-name">${esc(city.name)}</div>
        <div class="city-dates">${esc(city.dates)}</div>
        <div class="city-nights">${esc(city.nights)}</div>
      </${tag}>`;
      if (city.line_after) {
        const lineClass = city.line_after === 'flight' ? 'route-line flight' : 'route-line';
        html += `<div class="${lineClass}"></div>`;
      }
    });
    container.innerHTML = html;
  }

  function renderItinerary(data) {
    const savedNotes = JSON.parse(localStorage.getItem('jd-day-notes') || '{}');
    const container = document.getElementById('cityBlocks');
    container.innerHTML = data.itinerary.cities.map((city, ci) => {
      const daysHTML = city.days.map((day, di) => {
        const noteKey = `${ci}-${di}`;
        const noteVal = savedNotes[noteKey] || '';
        const hasNotes = noteVal ? ' has-notes' : '';
        const placesHTML = day.places.map((p, pi) => {
          const clickable = p.extended ? ` onclick="openPlaceModal(${ci},${di},${pi})"` : '';
          const mapsQ = (p.extended && p.extended.maps_query) || p.name + ' Japan';
          const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapsQ)}`;
          const mapsLink = `<a class="place-maps" href="${mapsUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍</a>`;
          return `<div class="place-item"${clickable}>
            <span class="place-tag ${esc(p.tag)}">${esc(p.tag_text)}</span>
            <span class="place-desc"><span class="place-name">${esc(p.name)}</span>${mapsLink} — ${esc(p.desc)}</span>
          </div>`;
        }).join('');
        return `<div class="day-entry">
          <div>
            <div class="day-num">${esc(day.num)}</div>
            <span class="day-date">${esc(day.date)}</span>
          </div>
          <div class="day-content">
            <h4>${esc(day.title)}</h4>
            <div class="places-list">${placesHTML}</div>
            <button class="day-notes-toggle${hasNotes}" onclick="toggleDayNotes(this)" data-nk="${noteKey}">📝 Notes</button>
            <div class="day-notes-area" data-nk="${noteKey}">
              <textarea placeholder="Booking refs, restaurant names, tips..." data-nk="${noteKey}" oninput="saveDayNote(this)">${esc(noteVal)}</textarea>
            </div>
          </div>
        </div>`;
      }).join('');

      const slug = citySlug(city.name);
      const cityImg = city.image
        ? `<img class="city-header-img" src="${esc(city.image)}" alt="${esc(city.name)}" loading="lazy" onerror="this.style.display='none'">` : '';
      return `<div class="city-block" id="city-${slug}">
        <div class="city-header">
          ${cityImg}
          <div class="city-flag">${city.flag}</div>
          <div class="city-block-name">${esc(city.name)}</div>
          <div class="city-block-jp">${esc(city.jp)}</div>
          <div class="city-block-dates">${esc(city.dates)}</div>
          <div class="city-block-nights">${esc(city.nights)}</div>
        </div>
        <div class="day-list">${daysHTML}</div>
      </div>`;
    }).join('');
  }

  function toggleDayNotes(btn) {
    const area = btn.nextElementSibling;
    area.classList.toggle('open');
    if (area.classList.contains('open')) area.querySelector('textarea').focus();
  }

  function saveDayNote(textarea) {
    const key = textarea.dataset.nk;
    const notes = JSON.parse(localStorage.getItem('jd-day-notes') || '{}');
    if (textarea.value.trim()) {
      notes[key] = textarea.value;
    } else {
      delete notes[key];
    }
    localStorage.setItem('jd-day-notes', JSON.stringify(notes));
    const btn = textarea.closest('.day-content').querySelector('.day-notes-toggle');
    btn.classList.toggle('has-notes', !!textarea.value.trim());
  }

  function renderHiddenGems(data) {
    const container = document.getElementById('quietGrid');
    container.innerHTML = data['hidden-gems'].gems.map((gem, gi) => {
      const dots = Array.from({length: 5}, (_, i) =>
        `<div class="crowd-dot${i < gem.crowd_level ? ' filled' : ''}"></div>`
      ).join('');
      const imgHTML = gem.image
        ? `<div style="overflow:hidden"><img class="quiet-card-img" src="${esc(gem.image)}" alt="${esc(gem.name)}" loading="lazy" onerror="this.style.display='none'"></div>` : '';
      const click = gem.extended ? ` onclick="openGemModal(${gi})"` : '';
      const mapsQ = gem.name + ' ' + gem.city + ' Japan';
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapsQ)}`;
      return `<div class="quiet-card"${click}>
        ${imgHTML}
        <div class="quiet-card-body">
          <div class="city-badge">${esc(gem.city)}</div>
          <h3>${esc(gem.name)}</h3>
          <p>${esc(gem.description)}</p>
          <div class="crowd-meter">
            <div class="crowd-dots">${dots}</div>
            <span class="crowd-label">${esc(gem.crowd_label)}</span>
          </div>
          <a class="gem-maps-link" href="${mapsUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 Google Maps</a>
        </div>
      </div>`;
    }).join('');
  }

  function renderBudget(data) {
    const b = data.budget;
    const container = document.getElementById('budgetGrid');
    const barsHTML = b.items.map(item =>
      `<div class="budget-item">
        <div class="budget-item-top">
          <span class="budget-name">${esc(item.name)}</span>
          <span class="budget-amount">${esc(item.amount)}</span>
        </div>
        <div class="budget-bar-track"><div class="budget-bar-fill" style="--w:${item.weight}"></div></div>
      </div>`
    ).join('');

    const paragraphs = b.summary.paragraphs.map(p => `<p>${p}</p>`).join('');

    container.innerHTML = `
      <div>
        <div class="budget-bars" id="budgetBars">${barsHTML}</div>
        <div class="budget-total">
          <span class="label">Total Estimated</span>
          <span class="big">${esc(b.total)}</span>
        </div>
      </div>
      <div class="budget-summary">
        <h3>${esc(b.summary.title)}</h3>
        ${paragraphs}
        <span class="buffer-amount">${esc(b.summary.buffer_amount)}</span>
        <p style="margin-top:1rem;">${esc(b.summary.extra_note)}</p>
      </div>`;
  }

  function renderFood(data) {
    const container = document.getElementById('foodGrid');
    container.innerHTML = data.food.cities.map((city, ci) =>
      `<div class="food-city">
        <div class="food-city-name">${esc(city.name)}</div>
        <div class="food-items">
          ${city.items.map((item, fi) => {
            const name = typeof item === 'string' ? item : item.name;
            const hasExt = typeof item === 'object' && item.extended;
            const click = hasExt ? ` onclick="openFoodModal(${ci},${fi})"` : '';
            return `<div class="food-item"${click}>${esc(name)}</div>`;
          }).join('')}
        </div>
      </div>`
    ).join('');
  }

  function renderChecklist(data) {
    const saved = JSON.parse(localStorage.getItem('jd-checklist') || '{}');
    const container = document.getElementById('checklistGrid');
    container.innerHTML = data.checklist.groups.map((group, gi) =>
      `<div class="checklist-group">
        <h3>${esc(group.title)}</h3>
        <div class="check-items">
          ${group.items.map((item, ii) => {
            const key = `${gi}-${ii}`;
            const done = saved[key] ? ' done' : '';
            return `<div class="check-item${done}" data-ck="${key}" onclick="toggleCheck(this)">
              <div class="check-box"></div>
              <span class="check-text">${esc(item)}</span>
            </div>`;
          }).join('')}
        </div>
      </div>`
    ).join('');
  }

  function toggleCheck(el) {
    el.classList.toggle('done');
    const all = document.querySelectorAll('.check-item');
    const state = {};
    all.forEach(item => {
      if (item.classList.contains('done')) state[item.dataset.ck] = true;
    });
    localStorage.setItem('jd-checklist', JSON.stringify(state));
  }

  function renderFooter(data) {
    const f = data.trip.footer;
    document.getElementById('footer').innerHTML = `
      <p>${f.line1}</p>
      <p style="margin-top:0.5rem;">${f.line2}</p>`;
  }

  // ── Modal system ───────────────────────────

  let _modalData = {};

  function openModal(html) {
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  function mapsLink(query) {
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
  }

  function openPlaceModal(ci, di, pi) {
    const place = _modalData.itinerary.cities[ci].days[di].places[pi];
    const ext = place.extended;
    if (!ext) return;

    const metaItems = [
      ext.hours ? {label: 'Hours', value: ext.hours} : null,
      ext.time_needed ? {label: 'Time Needed', value: ext.time_needed} : null,
      ext.station ? {label: 'Nearest Station', value: ext.station} : null,
    ].filter(Boolean);

    const metaHTML = metaItems.length ? `<div class="modal-meta">${metaItems.map(m =>
      `<div class="modal-meta-item"><div class="modal-meta-label">${esc(m.label)}</div><div class="modal-meta-value">${esc(m.value)}</div></div>`
    ).join('')}</div>` : '';

    const tipHTML = ext.tips ? `<div class="modal-tip"><div class="modal-tip-label">💡 Tips</div><p>${esc(ext.tips)}</p></div>` : '';

    const activityHTML = ext.activity ? `<div class="modal-activity">
      <div class="modal-activity-label">🎯 Activity Info</div>
      <div class="modal-activity-grid">
        ${ext.activity.booking ? `<div class="modal-activity-item"><strong>Booking</strong>${esc(ext.activity.booking)}</div>` : ''}
        ${ext.activity.cost ? `<div class="modal-activity-item"><strong>Cost</strong>${esc(ext.activity.cost)}</div>` : ''}
        ${ext.activity.duration ? `<div class="modal-activity-item"><strong>Duration</strong>${esc(ext.activity.duration)}</div>` : ''}
        ${ext.activity.what_to_bring ? `<div class="modal-activity-item"><strong>What to Bring</strong>${esc(ext.activity.what_to_bring)}</div>` : ''}
      </div>
    </div>` : '';

    const mapHTML = ext.maps_query ? `<a class="modal-maps-link" href="${mapsLink(ext.maps_query)}" target="_blank" rel="noopener">📍 Open in Google Maps</a>` : '';

    openModal(`
      <div class="modal-tag">${esc(place.tag_text)}</div>
      <div class="modal-title">${esc(place.name)}</div>
      <div class="modal-subtitle">${esc(place.desc)}</div>
      <div class="modal-body"><p>${esc(ext.full_desc)}</p></div>
      ${metaHTML}
      ${tipHTML}
      ${activityHTML}
      ${mapHTML}
    `);
  }

  function openFoodModal(ci, fi) {
    const city = _modalData.food.cities[ci];
    const food = city.items[fi];
    if (!food.extended) return;
    const ext = food.extended;

    const whereHTML = ext.where ? `<div class="modal-food-where">📍 ${esc(ext.where)}</div>` : '';
    const metaHTML = `<div class="modal-food-meta">
      ${ext.price ? `<span class="modal-food-badge">💰 ${esc(ext.price)}</span>` : ''}
      ${ext.dietary ? `<span class="modal-food-badge">🍽️ ${esc(ext.dietary)}</span>` : ''}
    </div>`;

    openModal(`
      <div class="modal-tag">${esc(city.name)} · Food</div>
      <div class="modal-title">${esc(food.name)}</div>
      ${whereHTML}
      ${metaHTML}
      <div class="modal-body"><p>${esc(ext.description)}</p></div>
    `);
  }

  function openGemModal(gi) {
    const gem = _modalData['hidden-gems'].gems[gi];
    if (!gem.extended) return;
    const ext = gem.extended;

    const infoBlocks = [
      ext.best_time ? {label: 'Best Time', value: ext.best_time} : null,
      ext.how_to_get ? {label: 'How to Get There', value: ext.how_to_get} : null,
      ext.nearby ? {label: 'Nearby', value: ext.nearby} : null,
      ext.crowd_tips ? {label: 'Crowd Tips', value: ext.crowd_tips} : null,
    ].filter(Boolean);

    const infoHTML = infoBlocks.length ? `<div class="modal-gem-info">${infoBlocks.map(b =>
      `<div class="modal-gem-block"><div class="modal-gem-block-label">${esc(b.label)}</div><div class="modal-gem-block-value">${esc(b.value)}</div></div>`
    ).join('')}</div>` : '';

    openModal(`
      <div class="modal-tag">${esc(gem.city)} · Hidden Gem</div>
      <div class="modal-title">${esc(gem.name)}</div>
      <div class="modal-subtitle">${esc(gem.description)}</div>
      <div class="modal-body"><p>${esc(ext.full_desc)}</p></div>
      ${infoHTML}
    `);
  }

  // ── Sharing & Export ───────────────────────

  function shareTrip() {
    if (navigator.share) {
      navigator.share({
        title: 'Japan 2026 — Travel Plan',
        text: '15-day Japan trip: Osaka → Kyoto → Hiroshima → Okinawa → Tokyo. Check out the full itinerary!',
        url: window.location.href
      }).catch(() => {});
    }
  }

  function exportICS() {
    const cities = _modalData.itinerary.cities;
    let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//JapanDays//Trip//EN\r\nCALSCALE:GREGORIAN\r\n';

    cities.forEach(city => {
      city.days.forEach(day => {
        const dateStr = day.date + ', 2026';
        const d = new Date(dateStr);
        if (isNaN(d)) return;
        const ymd = d.toISOString().slice(0, 10).replace(/-/g, '');
        const places = day.places.map(p => p.name).join(', ');
        const desc = day.places.map(p => `${p.name} — ${p.desc}`).join('\\n');

        ics += 'BEGIN:VEVENT\r\n';
        ics += `DTSTART;VALUE=DATE:${ymd}\r\n`;
        ics += `DTEND;VALUE=DATE:${ymd}\r\n`;
        ics += `SUMMARY:${city.name}: ${day.title}\r\n`;
        ics += `DESCRIPTION:${desc.replace(/\r?\n/g, '\\n')}\r\n`;
        ics += `LOCATION:${places}\r\n`;
        ics += 'END:VEVENT\r\n';
      });
    });

    ics += 'END:VCALENDAR\r\n';
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'japan-2026-itinerary.ics';
    a.click();
    URL.revokeObjectURL(url);
  }

  function toggleQR() {
    const container = document.getElementById('qrContainer');
    if (container.classList.contains('open')) {
      container.classList.remove('open');
      return;
    }
    container.innerHTML = '';
    if (typeof qrcode === 'function') {
      const qr = qrcode(0, 'M');
      qr.addData(window.location.href);
      qr.make();
      container.innerHTML = qr.createSvgTag({ scalable: true });
      const svg = container.querySelector('svg');
      if (svg) {
        svg.style.width = '180px';
        svg.style.height = '180px';
        svg.style.borderRadius = '8px';
        svg.style.border = '3px solid rgba(245,240,232,0.1)';
      }
      container.classList.add('open');
    } else {
      container.innerHTML = '<p style="color:rgba(245,240,232,0.3);font-size:0.6rem;">QR library not available</p>';
      container.classList.add('open');
    }
  }

  if (navigator.share) {
    document.getElementById('btnShare').style.display = '';
  }

  // ── Theme toggle ───────────────────────────

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem('jd-theme', next);
    applyTheme(next);
  }

  // Apply saved theme immediately
  const savedTheme = localStorage.getItem('jd-theme') || 'light';
  applyTheme(savedTheme);

  // Expose interactive functions to onclick handlers
  window.toggleTheme = toggleTheme;
  window.toggleCheck = toggleCheck;
  window.toggleDayNotes = toggleDayNotes;
  window.saveDayNote = saveDayNote;
  window.openPlaceModal = openPlaceModal;
  window.openFoodModal = openFoodModal;
  window.openGemModal = openGemModal;
  window.closeModal = closeModal;
  window.shareTrip = shareTrip;
  window.exportICS = exportICS;
  window.toggleQR = toggleQR;

  // ── Animations ─────────────────────────────

  function initAnimations() {
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('visible', window.scrollY > window.innerHeight * 0.5);
    });

    const bars = document.querySelectorAll('.budget-bar-fill');
    bars.forEach(bar => {
      bar.style.transform = 'scaleX(0)';
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const fills = entry.target.querySelectorAll('.budget-bar-fill');
          fills.forEach((fill, i) => {
            const w = fill.style.getPropertyValue('--w');
            setTimeout(() => {
              fill.style.transition = 'transform 1.2s cubic-bezier(0.4,0,0.2,1)';
              fill.style.transform = `scaleX(${w})`;
            }, i * 120);
          });
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.3 });

    const budgetEl = document.getElementById('budgetBars');
    if (budgetEl) observer.observe(budgetEl);

    const cityObs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          cityObs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.city-block').forEach(el => cityObs.observe(el));

    if (window.location.hash) {
      const target = document.querySelector(window.location.hash);
      if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 800);
    }
  }

  // ── Boot ───────────────────────────────────

  try {
    const data = await loadAllData();
    _modalData = data;

    renderNav(data);
    renderHero(data);
    renderFlights(data);
    renderRoute(data);
    renderItinerary(data);
    renderHiddenGems(data);
    renderBudget(data);
    renderFood(data);
    renderChecklist(data);
    renderFooter(data);

    initAnimations();

    const loader = document.getElementById('loadingScreen');
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 600);
  } catch (err) {
    console.error('Failed to load trip data:', err);
    document.getElementById('loadingScreen').innerHTML = `
      <div class="loading-text" style="color: var(--vermilion);">
        Error loading data: ${err.message}<br>
        Make sure YAML files exist in the data/ folder.
      </div>`;
  }
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
